<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="../shared/hot.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>READ IN · THEACTORPAGE</title>
<meta name="description" content="Read the other parts for a friend's audition, on your own time, and send it back.">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#121110">
<link rel="icon" href="../img/sigil-film-64.png">
<style>
@font-face{font-family:Jost;font-weight:400;font-display:swap;src:url(../memorizer/fonts/jost-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Jost;font-weight:500;font-display:swap;src:url(../memorizer/fonts/jost-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Courier Prime';font-weight:400;font-display:swap;src:url(../memorizer/fonts/courier-prime-latin-400-normal.woff2) format('woff2')}
:root{--bg:#121110;--panel:#1b1916;--ink:#ece7dc;--dim:#a39c8e;--faint:#6e675c;--line:#2f2b26;--tung:#e0a23c;--tung-ink:#1a1206;--bad:#e0785f;--good:#8fbf8a;
 --sans:Jost,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Courier Prime","Courier New",Courier,monospace;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 16px 120px}
.eyebrow{font-size:10.5px;letter-spacing:.2em;color:var(--tung);margin:0 0 6px}
h1{font-weight:500;font-size:clamp(1.4rem,6vw,1.9rem);line-height:1.2;margin:0 0 10px}
p{margin:0 0 12px}.dim{color:var(--dim)}.small{font-size:13px}
.how{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:16px 0}
.how ol{margin:6px 0 0;padding-left:20px}.how li{margin:2px 0}
label.nm{display:block;font-size:10.5px;letter-spacing:.16em;color:var(--dim);margin:14px 0 4px}
input.nm{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:11px 12px;font:inherit}
.prog{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}
.prog b{font-weight:500}
.ln{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;background:var(--panel)}
.ln.cue{background:none;border-style:dashed;opacity:.6}
.ln .who{font-size:10.5px;letter-spacing:.16em;color:var(--tung);margin-bottom:4px}
.ln.cue .who{color:var(--dim)}
.ln .tx{font-family:var(--mono);font-size:15.5px;white-space:pre-wrap}
.ln.done{border-color:#3f5a3c}.ln.done .who:after{content:'  \2713 RECORDED';color:var(--good)}
.ln.on{border-color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button{font:inherit;font-size:12px;letter-spacing:.1em;border-radius:9px;padding:10px 13px;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer}
button.go{background:var(--tung);color:var(--tung-ink);border-color:var(--tung);font-weight:500}
button.rec{border-color:var(--bad);color:var(--bad)}
button:disabled{opacity:.4}
.send{position:fixed;left:0;right:0;bottom:0;background:rgba(18,17,16,.97);border-top:1px solid var(--line);padding:12px 16px max(12px,env(safe-area-inset-bottom))}
.send .in{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between}
.send small{color:var(--dim);font-size:12px}
.msg{color:var(--tung);font-size:13px;margin:8px 0}
.bad{color:var(--bad)}
</style>
</head>
<body>
<main id="main"><p class="dim">Opening the scene&hellip;</p></main>
<div class="send" id="send" hidden><div class="in"><small id="sendwhy"></small><button class="go" id="sendbtn">SEND IT BACK</button></div></div>
<script src="../shared/zipw.js"></script>
<script src="../shared/readin.js"></script>
<script src="app.js"></script>
</body>
</html>
