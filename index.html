<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="shared/tour.js"></script>
<script src="shared/hot.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>THEACTORPAGE</title>
<meta name="description" content="Your studio on a computer: your page, headshots, writing and films. Actor OS on your phone: sides in, tape sent. Free, and it all stays on your devices.">
<link rel="icon" type="image/png" href="img/sigil-film-64.png">
<link rel="apple-touch-icon" href="img/app-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#121110">
<style>
@font-face{font-family:Jost;font-weight:400;font-display:swap;src:url(fonts/jost-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Jost;font-weight:500;font-display:swap;src:url(fonts/jost-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:Jost;font-weight:600;font-display:swap;src:url(fonts/jost-latin-600-normal.woff2) format('woff2')}
/* THE STUDIO (Col, Oct 26): theactorpage.com is the studio on a computer; Actor OS is the phone app.
   Light by day, dark at night, like the other website tools. The pitch lives on how.html. */
:root{
 --bg:#ece7dc;--panel:#f6f2ea;--panel2:#e3dccd;--ink:#1d1a15;--dim:#5f584b;--faint:#8a8273;--line:#d3cab8;--rule:#e3dccd;
 --act:#8a5a08;--write:#1f6b47;--film:#245a8c;--gold:#e0a23c;--gold-ink:#1a1206;--dark:#1d1a15;--dark-ink:#ece7dc;--dark-dim:#b8b0a2;
 --sans:Jost,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
 --bg:#121110;--panel:#1b1916;--panel2:#24211d;--ink:#ece7dc;--dim:#a39c8e;--faint:#6e675c;--line:#2f2b26;--rule:#26231f;
 --act:#e9b25a;--write:#6fc79a;--film:#8cc3ee;--dark:#24211d;--dark-ink:#ece7dc;--dark-dim:#a39c8e;color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#121110;--panel:#1b1916;--panel2:#24211d;--ink:#ece7dc;--dim:#a39c8e;--faint:#6e675c;--line:#2f2b26;--rule:#26231f;
 --act:#e9b25a;--write:#6fc79a;--film:#8cc3ee;--dark:#24211d;--dark-ink:#ece7dc;--dark-dim:#a39c8e;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);-webkit-text-size-adjust:100%}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.bar{height:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:calc(env(safe-area-inset-top) + 14px) max(16px,env(safe-area-inset-right)) 14px max(16px,env(safe-area-inset-left));background:var(--panel)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}.brand img{width:36px;height:36px;object-fit:contain}.brand b{font-size:17px;letter-spacing:.24em;font-weight:500}
.tlinks{display:flex;align-items:center;gap:18px;font-size:14px;flex-wrap:wrap;justify-content:flex-end}.tlinks a{text-decoration:none;color:var(--dim)}.tlinks a:hover{color:var(--ink)}
.who{display:flex;align-items:center;gap:10px;padding:5px 12px 5px 5px;border:1px solid var(--line);border-radius:22px;background:var(--bg);text-decoration:none;color:var(--ink)!important;font-weight:600}.who img,.who i{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--panel2);display:block}
main{max-width:1240px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
.k{font-size:12px;font-weight:600;letter-spacing:.2em}
/* the studio */
.shead{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:0 0 18px;padding-top:18px;border-top:1px solid var(--line)}.shead h1{margin:0;font-size:28px;font-weight:600}.shead p{margin:0;color:var(--dim);font-size:14.5px}
.sgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
.rooms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.room.own{grid-column:1/-1}.room.own .rin{display:flex;align-items:center;gap:24px;padding:12px 18px}.room.own .rin>.k,.room.own .rin>.rsub{flex:none}.room.own .rin>.rsub{margin:0;width:190px}.room.own a{border-top:0;flex:1}
.room{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}.room>.sticks{height:12px}.rin{padding:16px 18px 6px}
.room .k{display:block;margin-bottom:2px;font-size:13px;letter-spacing:.22em;font-weight:700}.rsub{display:block;font-size:13px;color:var(--dim);margin:0 0 8px}.room.act .k{color:var(--act)}.room.write .k{color:var(--write)}.room.film .k{color:var(--film)}
.room a{display:flex;align-items:center;gap:14px;padding:10px 0;border-top:1px solid var(--line);text-decoration:none}.room.act svg.ic{color:var(--act)}.room.write svg.ic{color:var(--write)}.room.film svg.ic{color:var(--film)}
.room a span{display:flex;flex-direction:column;min-width:0}.room a b{font-weight:600;font-size:16px}.room a i{font-style:normal;font-size:13px;color:var(--dim)}.room a:hover b{text-decoration:underline}.room a:hover svg.ic{transform:translateY(-1px)}
.side{display:flex;flex-direction:column;gap:16px}
.aos{background:var(--dark);color:var(--dark-ink);border-radius:16px;overflow:hidden}.aos>.sticks{height:12px}.ain{padding:18px 20px 20px;display:flex;flex-direction:column;gap:10px}
.aos .k{color:var(--gold);display:flex;align-items:center;gap:10px}svg.ic.sm{width:34px;height:34px}.aos svg.ic{color:var(--gold)}
.fsteps4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.fsteps4 span{border:1px solid #3a3530;border-radius:8px;padding:7px 0;text-align:center;font-size:11px;letter-spacing:.16em;font-weight:700;color:#e9b25a}.aos b{font-size:18px;line-height:1.25;font-weight:600}.aos small{color:var(--dark-dim);font-size:13px;line-height:1.45}
.qr{display:flex;gap:14px;align-items:center}.qr .code{width:104px;height:104px;background:#fff;border-radius:8px;padding:6px;flex:none}.qr .code svg{width:100%;height:100%;display:block}
.aos a{color:var(--gold);font-weight:600;font-size:14px;text-decoration:none}
.yours{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;font-size:14px;display:flex;gap:14px;align-items:center}.yours svg.ic{color:var(--dim)}.yours .k{display:block;color:var(--dim);margin-bottom:6px}.yours a{color:var(--act);font-weight:600}
.me{display:flex;align-items:center;gap:22px;margin:0 0 22px}
.mephoto{flex:none;display:block;width:132px;height:165px;border-radius:12px;overflow:hidden;background:var(--panel2);border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.12)}
.mephoto img{width:100%;height:100%;object-fit:cover;display:block}
.mephoto.none{display:flex;align-items:center;justify-content:center;cursor:pointer;border-style:dashed;text-align:center}.mephoto.none span{font-size:12px;letter-spacing:.14em;font-weight:600;color:var(--dim);padding:8px}
.metx{display:flex;flex-direction:column;gap:4px;min-width:0}.mename{font-size:30px;font-weight:600;line-height:1.1}.mefacts{color:var(--dim);font-size:15px}
.melinks{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px;font-size:14.5px}.melinks a{color:var(--act);font-weight:600;text-decoration:none}
@media (max-width:640px){.mephoto{width:104px;height:130px}.mename{font-size:24px}.me{gap:16px}}
/* first visit */
.first{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:40px;align-items:start;padding-top:12px}
.first .k.lead{color:var(--act)}.first h1{margin:14px 0 14px;font-size:clamp(30px,4vw,44px);line-height:1.1;font-weight:600;text-wrap:balance}
.first p.say{margin:0 0 22px;font-size:17px;color:var(--dim);line-height:1.55;max-width:560px}
.start{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;max-width:640px}.start>.sticks{height:12px}.stin{padding:18px 22px 20px}
.stin>b{display:block;font-size:18px;font-weight:600;margin-bottom:6px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-top:1px solid var(--rule)}.srow div{display:flex;flex-direction:column;gap:2px}.srow b{font-weight:600}.srow span{font-size:13.5px;color:var(--dim)}.srow .done{color:var(--write);font-weight:600}
.btn{min-height:46px;padding:0 18px;border-radius:10px;border:1px solid var(--ink);background:transparent;font-weight:600;letter-spacing:.08em;font-size:13.5px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;position:relative;overflow:hidden}
.btn.pri{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}.btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.start .note{display:block;font-size:13px;color:var(--dim);margin-top:4px}
.alt{display:flex;gap:18px;flex-wrap:wrap;margin-top:16px;font-size:14px}.alt a{color:var(--act);font-weight:600;text-decoration:none}
.inside{display:flex;flex-direction:column;gap:12px}.inside>.k{color:var(--dim)}
.inside .ib{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:14px;display:flex;flex-direction:column;gap:4px}.inside .ib .k{font-size:11.5px}
.inside .ib.act .k{color:var(--act)}.inside .ib.write .k{color:var(--write)}.inside .ib.film .k{color:var(--film)}.inside .ib.aosb{background:var(--dark);color:var(--dark-ink);border-color:var(--dark)}.inside .ib.aosb .k{color:var(--gold)}
/* a phone */
.phone{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.pcard{background:var(--panel);border:1px solid var(--gold);border-radius:16px;overflow:hidden}.pcard>.sticks{height:12px}.pin{padding:18px;display:flex;flex-direction:column;gap:10px}.pcard .k{color:var(--act);display:flex;align-items:center;gap:10px}.pcard svg.ic{color:var(--act)}
.psteps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.psteps span{border:1px solid var(--line);border-radius:10px;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;letter-spacing:.16em;font-weight:700;color:var(--act)}.psteps svg.ic{width:24px;height:24px}.pcard b{font-size:24px;line-height:1.2;font-weight:600}.pcard p{margin:0;color:var(--dim);font-size:14.5px}
.pcard .btn{min-height:56px;font-size:15px;width:100%}.pcard small{color:var(--dim);font-size:13px}
.plink{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;gap:14px;align-items:center;text-decoration:none}.plink>span{display:flex;flex-direction:column;gap:2px}.plink b{font-size:17px;font-weight:600}.plink span span{font-size:13.5px;color:var(--dim)}svg.ic.dim{color:var(--dim)}
.pst{border:1px dashed var(--line);border-radius:14px;padding:14px 16px;display:flex;gap:14px;align-items:flex-start;font-size:14px;color:var(--dim)}.pst>div{display:flex;flex-direction:column;gap:6px}.pst .k{color:var(--dim)}.pst button{background:none;border:0;padding:0;text-align:left;color:var(--act);font-weight:600;font-size:14px;min-height:36px}
.foot{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;font-size:13px;color:var(--dim);margin:30px 0 0}.foot a{color:var(--dim);text-decoration:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}.toast.on{opacity:1}
@media (max-width:1000px){.sgrid,.first{grid-template-columns:1fr}.rooms{grid-template-columns:1fr 1fr}.room.own .rin{flex-wrap:wrap}}
@media (max-width:640px){.rooms{grid-template-columns:1fr}.room.own .rin{display:block;padding:16px 18px 6px}.room.own .rin>.rsub{width:auto;margin:0 0 8px}.room.own a{border-top:1px solid var(--line)}.tlinks .hide-s{display:none}.srow{flex-direction:column;align-items:stretch}.srow .btn{width:100%}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="./" aria-label="THEACTORPAGE, your studio"><img src="img/sigil-film-180.png" alt="" width="36" height="36"><b>THEACTORPAGE</b></a>
  <nav class="tlinks" id="tlinks" aria-label="The site"></nav>
</header>
<span class="sticks bar" aria-hidden="true"></span>
<main id="main"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="shared/you.js"></script>
<script src="actor-os/sides.js"></script>
<script src="actor-os/pdf.js"></script>
<script src="hub/request.js"></script>
<script src="shared/intake.js"></script>
<script src="film/vendor/qrcode.min.js"></script>
<script src="shared/icons.js"></script>
<script src="shared/frontpage.js"></script>
<script src="shared/view.js"></script>
<script>if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
</body>
</html>
