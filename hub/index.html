*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--mono);font-size:13px;line-height:1.5;
background-image:radial-gradient(900px 420px at 82% -10%,rgba(224,162,60,.06),transparent 60%)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 60px}
.bar{height:11px;background:repeating-linear-gradient(90deg,transparent 0 15px,var(--p1) 15px 26px);border-bottom:1px solid var(--line);opacity:.8}
header{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:18px 4px 12px}
.sig{width:84px;height:84px;background:var(--sig) center/contain no-repeat;filter:drop-shadow(0 2px 5px rgba(0,0,0,.65)) drop-shadow(0 0 12px rgba(224,162,60,.24));flex:0 0 84px}
.tt h1{margin:0;font-size:30px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;line-height:1}
.tt .sub{font-size:12px;color:var(--mut);margin-top:6px;letter-spacing:.05em;max-width:640px;line-height:1.6}
.who{text-align:right;font-size:10px;letter-spacing:.06em;color:var(--faint);line-height:1.6}
.who b{color:var(--tung);font-size:11px;letter-spacing:.1em}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:6px 0 18px;flex-wrap:wrap}
nav button{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--mut);font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;padding:10px 14px;cursor:pointer}
nav button.on{color:var(--tung);border-bottom-color:var(--tung)}
nav button:hover{color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
@media(max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}header{grid-template-columns:1fr;justify-items:center;text-align:center}.who{text-align:center}}
.kpi{border:1px solid var(--line);border-radius:7px;background:var(--p1);padding:12px 14px}
.kpi .n{font-size:24px;font-weight:700;color:var(--tung)}
.kpi .l{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);margin-top:2px}
.panel{border:1px solid var(--line);border-radius:7px;background:var(--p1);margin-bottom:14px;overflow:hidden}
.panel h2{margin:0;padding:12px 15px 9px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:11px;padding:13px}
.card{border:1px solid var(--line2);border-radius:7px;background:var(--p2);padding:12px 13px;cursor:pointer;transition:.12s}

/* ===== FULL BACKUP: store-only ZIP (pure JS, no dependency) carries text + all media ===== */
function crc32(buf){let c=~0;for(let i=0;i<buf.length;i++){c^=buf[i];for(let k=0;k<8;k++)c=(c>>>1)^(0xEDB88320&-(c&1));}return (~c)>>>0;}
async function zipStore(entries){
 const enc=new TextEncoder();const parts=[];let offset=0;const central=[];
 for(const e of entries){const nb=enc.encode(e.name);const crc=crc32(e.data);const sz=e.data.length;
  const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);lh.setUint16(26,nb.length,true);
  parts.push(new Uint8Array(lh.buffer),nb,e.data);central.push({crc,sz,nb,offset});offset+=30+nb.length+sz;}
 const cdStart=offset;const cd=[];
 for(const c of central){const d=new DataView(new ArrayBuffer(46));d.setUint32(0,0x02014b50,true);d.setUint16(4,20,true);d.setUint16(6,20,true);d.setUint32(16,c.crc,true);d.setUint32(20,c.sz,true);d.setUint32(24,c.sz,true);d.setUint16(28,c.nb.length,true);d.setUint32(42,c.offset,true);
  cd.push(new Uint8Array(d.buffer),c.nb);offset+=46+c.nb.length;}
 const cdSize=offset-cdStart;const eo=new DataView(new ArrayBuffer(22));eo.setUint32(0,0x06054b50,true);eo.setUint16(8,central.length,true);eo.setUint16(10,central.length,true);eo.setUint32(12,cdSize,true);eo.setUint32(16,cdStart,true);
 return new Blob([...parts,...cd,new Uint8Array(eo.buffer)],{type:'application/zip'});}
async function zipRead(blob){
 const buf=new Uint8Array(await blob.arrayBuffer());const dv=new DataView(buf.buffer);
 let eo=-1;for(let i=buf.length-22;i>=0;i--){if(dv.getUint32(i,true)===0x06054b50){eo=i;break;}}
 if(eo<0)throw new Error('not a zip');
 const n=dv.getUint16(eo+10,true);let p=dv.getUint32(eo+16,true);const out=[];const dec=new TextDecoder();
 for(let i=0;i<n;i++){const nameLen=dv.getUint16(p+28,true),extra=dv.getUint16(p+30,true),cmt=dv.getUint16(p+32,true);const lho=dv.getUint32(p+42,true);
  const name=dec.decode(buf.slice(p+46,p+46+nameLen));const lnl=dv.getUint16(lho+26,true),lex=dv.getUint16(lho+28,true);const sz=dv.getUint32(lho+18,true);const ds=lho+30+lnl+lex;
  out.push({name,data:buf.slice(ds,ds+sz)});p+=46+nameLen+extra+cmt;}
 return out;}

/* ===== THE RECORD =====
   What stood here was BAKE: a feature that rewrote this entire HTML file with every
   headshot, poster and clip base64'd into a SEED constant inside it, so the file
   itself carried the work. It solved a real problem - browser storage is tied to the
   exact file you opened, so a second copy of the hub opened empty - and it solved it
   by making the program and the data the same object.

   That is what made every new build dangerous. A build was a data carrier, so
   shipping you a new version meant shipping a file that either carried stale data or
   wiped what you had. The same defect took eight photographs off your site twice.

   The folder vault replaces it, and replaces it properly: media written to a real
   folder on disk, hub.json alongside it carrying all ten keys, read first at boot.
   The data outlives the file instead of living inside it. So a build now carries code
   and nothing else - not by discipline, but because there is no longer a slot to put
   data in.

   Gone with it: bakeHub, bakePanel, loadSeed, the SEED constant and its slot,
   shrinkImage and b64ToBlob, which existed only to serve them. Backups are a .zip
   (exportBackup) or a .json (exportData); both now carry everything. */

/* ===== IMDb IMPORT =====
   IMDb has no public API. TMDb does, it is free, and it indexes by IMDb id -
   so an IMDb URL is enough. Pulls credits + key art; footage is copyrighted and
   is never fetched, only linked. */
var TMDB_KEY='';
var imdbState={busy:false,person:null,rows:[],err:''};
const TMDB_IMG='https://image.tmdb.org/t/p/';
function imdbId(x){const m=String(x||'').match(/nm\d{5,}/);return m?m[0]:'';}
async function tmdb(path,params){
 const q=new URLSearchParams(Object.assign({api_key:TMDB_KEY},params||{}));
 const r=await fetch('https://api.themoviedb.org/3'+path+'?'+q);
 if(!r.ok)throw new Error(r.status===401?'That API key was rejected':'TMDb error '+r.status);
 return r.json();}
async function imdbLookup(){
 const raw=($('imdburl')||{}).value||'';
 const id=imdbId(raw);
 if(!id){imdbState.err='That does not look like an IMDb name URL - it should contain nm followed by digits.';return render();}
 if(!TMDB_KEY){imdbState.err='Add a TMDb key first - it is free and takes a minute.';return render();}
 imdbState={busy:true,person:null,rows:[],err:''};render();
 try{
  const f=await tmdb('/find/'+id,{external_source:'imdb_id'});
  const per=(f.person_results||[])[0];
  if(!per)throw new Error('TMDb has no record for that IMDb id yet.');
  const cc=await tmdb('/person/'+per.id+'/combined_credits');
  const seen=new Set();
  const rows=(cc.cast||[]).map(c=>({
    key:(c.media_type||'')+':'+c.id+':'+(c.character||''),
    title:c.name||c.title||'',
    character:c.character||'',
    net:(c.media_type==='tv')?'TV':'Film',
    medium:(c.media_type==='tv')?'TV':'Film',
    year:String(c.first_air_date||c.release_date||'').slice(0,4),
    poster:c.poster_path||'',
    pop:c.popularity||0,
    pick:true}))
   .filter(r=>{if(!r.title||seen.has(r.title+r.character))return false;seen.add(r.title+r.character);return true;})
   .sort((a,b)=>(b.year||'').localeCompare(a.year||'')||b.pop-a.pop);
  imdbState={busy:false,person:per,rows:rows,err:rows.length?'':'No acting credits came back for that id.'};
 }catch(e){imdbState={busy:false,person:null,rows:[],err:e.message};}

async function exportBackup(){
 toast('Building full backup...');
 const meta=ARTS.map(a=>({id:a.id,scope:a.scope,category:a.category,label:a.label,filename:a.filename,type:a.type,size:a.size,added:a.added,tag:a.tag,clips:a.clips}));
 /* Built from vaultPayload so there is exactly one definition of "everything the
    hub holds". This manifest used to list profile, credits, projects and the media
    index only - so a backup zip, the thing you take to another machine, quietly
    left behind every note on every casting office, the credit tombstones, the
    standup and training logs and the TMDB key. */
 const manifest=Object.assign(vaultPayload(),{exported:new Date().toISOString(),arts:meta});
 const enc=new TextEncoder();const entries=[{name:'manifest.json',data:enc.encode(JSON.stringify(manifest))}];
 for(const a of ARTS){if(a.blob){try{const u8=new Uint8Array(await a.blob.arrayBuffer());entries.push({name:'media/'+a.id+'__'+(a.filename||'file').replace(/[^\w.\-]/g,'_'),data:u8});}catch(e){}}}
 const zip=await zipStore(entries);downloadBlob(zip,'colmac_hub_backup_'+new Date().toISOString().slice(0,10)+'.zip');
 toast('Full backup saved: data + '+ARTS.length+' media files');}
/* The ten keys, merged in. Shared by the .zip restore and the .json import so there
   is one place that decides how incoming data meets what is already here. Nothing
   replaces wholesale except the profile: credits merge by title, auditions merge by
   id, and office notes merge per office, because a note you wrote after the backup
   was taken is not something a restore gets to drop. */
async function restoreMeta(data){
 if(!data||typeof data!=='object')return;
 /* Restoring your own career into a fresh install would otherwise leave Riley Hart's
    six credits and ten auditions mixed in with yours, and the "clear the demo"
    banner sitting over your own work. If real data is arriving, the sample goes. */
 const incomingWork=!!((data.credits&&data.credits.length)
   ||(data.projects&&data.projects.length)
   ||String((data.profile||{}).name||'').trim());
 if(incomingWork&&typeof isDemo==='function'&&isDemo())await dropDemoData();
 if(data.profile){profile=data.profile;await DB.putMeta('profile',profile);}
 if(data.credits){const seen=new Set(data.credits.map(c=>(c.title||'').toLowerCase().trim()));
  const extra=credits.filter(c=>!seen.has((c.title||'').toLowerCase().trim()));
  credits=data.credits.concat(extra);ensureCids();await DB.putMeta('credits',credits);}
 if(data.projects){
  // MERGE. A backup taken before the audition history was wired in would
  // otherwise wipe all 189 of them - proven by restoring an old zip.
  const key=p=>p.aaid||p.id||[p.title,p.role,p.deadline].join('|');
  const have=new Map(projects.map(p=>[key(p),p]));
  data.projects.forEach(p=>{const k=key(p);
   if(have.has(k)){Object.assign(have.get(k),p);}   // incoming wins per field
   else{projects.push(p);have.set(k,p);}});
  await DB.putMeta('projects',projects);}
 if(data.creditTombs&&data.creditTombs.length){
  const t=new Set((CREDIT_TOMBS||[]).concat(data.creditTombs));
  CREDIT_TOMBS=Array.from(t);await DB.putMeta('creditTombs',CREDIT_TOMBS);}
 if(data.offmeta){
  OFFMETA=OFFMETA||{};
  Object.keys(data.offmeta).forEach(k=>{OFFMETA[k]=Object.assign({},OFFMETA[k]||{},data.offmeta[k]);});
  await DB.putMeta('offmeta',OFFMETA);}
 if(data.standup&&data.standup.items){standup=data.standup;await DB.putMeta('standup',standup);}
 if(data.train&&data.train.log){train=data.train;await DB.putMeta('train',train);}
 if(data.tmdbkey&&!TMDB_KEY){TMDB_KEY=data.tmdbkey;await DB.putMeta('tmdbkey',TMDB_KEY);}
 if(data.demoCleared){DEMO_CLEARED=true;await DB.putMeta('demoCleared',true);}
 try{vaultTouch();}catch(e){}
}

/* exportData wrote a .json that nothing could read back. This is the other half -
   and it is the route an older hub's text comes in on, since browser storage is tied
   to the exact file it was created in and does not travel with a new build. */
async function importData(file){

  await restoreMeta(d);

       +projects.length+' auditions (+'+(projects.length-before.pr)+'), '

async function importBackup(file){
 toast('Restoring backup...');
 try{const entries=await zipRead(file);const man=entries.find(e=>e.name==='manifest.json');if(!man)return toast('No manifest - not a hub backup');
  const data=JSON.parse(new TextDecoder().decode(man.data));
  await restoreMeta(data);
  await askPersist();
  // MERGE, do not replace. Anything already here that is not in the zip stays.
  const metaById={};(data.arts||[]).forEach(a=>metaById[a.id]=a);
  const had=new Map(ARTS.map(a=>[a.id,a]));
  const failed=[];let bytes=0,added=0,replaced=0;
  for(const e of entries){if(!e.name.startsWith('media/'))continue;const id=e.name.slice(6).split('__')[0];const m=metaById[id]||{};
   const blob=new Blob([e.data],{type:m.type||'application/octet-stream'});const rec=Object.assign({},m,{id,blob});
   try{await DB.put(rec);
    if(had.has(id)){ARTS=ARTS.map(a=>a.id===id?rec:a);replaced++;}
    else{ARTS.push(rec);added++;}
    bytes+=blob.size;}
   catch(x){failed.push({name:m.filename||m.label||id,size:blob.size,why:(x&&x.name)||'write failed'});}}
  const kept=ARTS.length-added-replaced;
  render();
  if(failed.length){
   const big=failed.reduce((t,f)=>t+f.size,0);
   const q=await quotaInfo();
   restoreReport={ok:added+replaced,okBytes:bytes,failed:failed,failedBytes:big,quota:q,kept:kept};
   render();
   toast('Restored '+(added+replaced)+' - '+failed.length+' could NOT be stored'+(kept?' - kept '+kept+' already here':''));
  }else{
   restoreReport=null;
   toast('Restored '+added+' new, '+replaced+' updated'+(kept?', kept '+kept:'')+' ('+mb(bytes)+')');
  }
 }catch(err){toast('Restore failed: '+err.message);}}

function parseRelDate(text){
 const t=text.toLowerCase();const now=new Date();let day=new Date(now);

 else if(/today|tonight/.test(t)){}
 else{const days=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];const di=days.findIndex(d=>t.includes(d));
  if(di>=0){let add=(di-now.getDay()+7)%7;if(add===0)add=7;day.setDate(day.getDate()+add);}else return '';}
 let hh=null,mm=0;let tm=t.match(/(\d{1,2})(?::(\d{2}))?\s*(a\.?m\.?|p\.?m\.?)/);
 if(tm){hh=+tm[1];mm=tm[2]?+tm[2]:0;if(/p/.test(tm[3])&&hh<12)hh+=12;if(/a/.test(tm[3])&&hh===12)hh=0;}
 else{tm=t.match(/(\d{1,2}):(\d{2})/);if(tm){hh=+tm[1];mm=+tm[2];}}
 if(hh==null)hh=9;
 day.setHours(hh,mm,0,0);const p=n=>String(n).padStart(2,'0');
 return `${day.getFullYear()}-${p(day.getMonth()+1)}-${p(day.getDate())}T${p(day.getHours())}:${p(day.getMinutes())}`;}
function parseVoice(raw){

 const tc=x=>x.replace(/\b\w/g,c=>c.toUpperCase());
 let casting='',title='',character='',desc='',deadline='',m;
 const ic=low.indexOf(' is casting');
 if(ic>=0){let pre=t.slice(0,ic);const seg=pre.split(/[,.;]|\b\d[\d:]*\s*(?:am|pm)?\b|\bdue\b|\btomorrow\b|\btoday\b|\btonight\b/i).pop()||'';casting=clean(seg.split(/\s+/).filter(Boolean).slice(-3).join(' '));}
 else{const ci=low.indexOf('casting');if(ci>=0){let seg=t.slice(ci+7).replace(/^\s*(director|is)\s+/i,'');seg=seg.split(/[,.;]|\bproject\b|\bcharacter\b|\bdue\b/i)[0]||'';casting=clean(seg.split(/\s+/).filter(Boolean).slice(0,3).join(' '));}}
 m=t.match(/project(?:'?s? name)?\s+(?:is\s+)?(?:called\s+|named\s+|titled\s+)?(.+?)(?=\s+(?:character|casting|due|status|stand ?by)\b|[,.;]|$)/i);
 if(m)title=clean(m[1]);
 m=t.match(/character(?:'?s? name)?\s+(?:is\s+)?["']?([a-z][\w'-]*)/i);
 if(m)character=clean(m[1]);else{m=t.match(/(?:playing|role is)\s+["']?([a-z][\w'-]*)/i);if(m)character=clean(m[1]);}
 if(character){const ci=low.indexOf(character.toLowerCase());if(ci>=0){let after=t.slice(ci+character.length).replace(/^[\s,'"-]+/,'').replace(/\bstand ?by.*$/i,'');after=clean(after);if(after&&after.length<90)desc=after;}}

function parseFDX(xml){

/* ---- camera light check (offline pixel math) ---- */
/* the light check: what it measured, in plain words. The middle of the frame is you, the edges are the room. No score. */
function lightWords(s){
 const L=[];
 if(s.you<70)L.push('Dark on you: '+Math.round(s.you)+' of 255 in the middle of the frame.');
 else if(s.you>215)L.push('Very bright on you: '+Math.round(s.you)+' of 255 in the middle of the frame.');
 if(s.edge-s.you>45)L.push('Brighter behind you than on you ('+Math.round(s.edge)+' against '+Math.round(s.you)+').');
 if(s.clipHigh>5)L.push(Math.round(s.clipHigh)+'% of the frame is pure white.');
 if(s.balance>0.18)L.push('The '+(s.left>s.right?'left':'right')+' side of the frame is brighter than the other.');
 return {flags:L,words:L.length?L:['Light: nothing flagged.']};
}
function frameStats(video){
 const w=64,h=48;const cv=document.createElement('canvas');cv.width=w;cv.height=h;const cx=cv.getContext('2d');
 cx.drawImage(video,0,0,w,h);const d=cx.getImageData(0,0,w,h).data;
 let hi=0,lsum=0,rsum=0,ln=0,rn=0,c=0,cn=0,e=0,en=0;const n=w*h,half=w/2;
 for(let i=0,px=0;i<d.length;i+=4,px++){const L=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];if(L>240)hi++;const col=px%w,row=(px/w)|0;if(col<half){lsum+=L;ln++;}else{rsum+=L;rn++;}if(col>20&&col<44&&row>8&&row<36){c+=L;cn++;}else if(col<10||col>54||row<6){e+=L;en++;}}
 return {you:c/cn,edge:e/en,clipHigh:hi/n*100,left:lsum/ln,right:rsum/rn,balance:Math.abs((lsum/ln)-(rsum/rn))/255};
}

/* ===== TRAIN: waveform + emotion delivery + voice bank ===== */
let emotionPick=null;
let _waveAudio=null, _waveRAF=null;

function vrms(td){let s=0;for(let i=0;i<td.length;i++){s+=td[i]*td[i];}return Math.sqrt(s/td.length);}
function drawWaveFrame(){
 const cv=$('wavecanvas');if(!cv||!_waveAudio)return;
 const an=_waveAudio.an,buf=_waveAudio.buf;
 try{if(an.getFloatTimeDomainData)an.getFloatTimeDomainData(buf);else{const b=new Uint8Array(an.fftSize);an.getByteTimeDomainData(b);for(let i=0;i<b.length;i++)buf[i]=(b[i]-128)/128;}}catch(e){return;}
 const cw=cv.clientWidth||cv.width||360;if(cv.width!==cw)cv.width=cw;if(cv.height!==64)cv.height=64;
 const x=cv.getContext('2d');const w=cv.width,h=64,mid=h/2;
 x.fillStyle='rgba(7,11,14,0.25)';x.fillRect(0,0,w,h);
 const r=vrms(buf),t=Math.max(0,Math.min(1,r/0.18));const hue=32+t*12,light=46+t*14;
 x.beginPath();x.strokeStyle='hsla('+hue+',78%,'+light+'%,0.95)';x.lineWidth=1.8;
 const step=Math.max(1,Math.floor(buf.length/w));
 for(let i=0;i<w;i++){const v=Math.max(-1,Math.min(1,(buf[i*step]||0)*2));const y=mid-v*(h*0.42);i===0?x.moveTo(i,y):x.lineTo(i,y);}
 x.stroke();
}
function startWave(stream){
 stopWave();
 try{const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx||!stream)return;
  const ctx=new Ctx();const src=ctx.createMediaStreamSource(stream);const an=ctx.createAnalyser();an.fftSize=1024;an.smoothingTimeConstant=0.15;src.connect(an);
  _waveAudio={ctx:ctx,an:an,buf:new Float32Array(an.fftSize)};
  const raf=window.requestAnimationFrame||function(f){return setTimeout(f,40);};
  const loop=function(){if(!_waveAudio)return;drawWaveFrame();_waveRAF=raf(loop);};
  _waveRAF=raf(loop);
 }catch(e){}
}
function stopWave(){try{if(_waveRAF)(window.cancelAnimationFrame||clearTimeout)(_waveRAF);}catch(e){}_waveRAF=null;try{if(_waveAudio&&_waveAudio.ctx)_waveAudio.ctx.close();}catch(e){}_waveAudio=null;}

 const missing=[];
 if(!projectTakes(p).length)missing.push('no take yet');else if(!bestTakeRating(p))missing.push('no take rated');

function coverageItems(p){
 const chars=p.shootChars||1;
 const names=chars===1?['your role']:(chars===2?['role A','role B']:Array.from({length:chars},function(_,i){return 'role '+(i+1);}));
 const items=[{k:'wide',label:'wide master',ci:-1}];
 names.forEach(function(nm,i){items.push({k:'med'+i,label:'medium - '+nm,ci:i},{k:'cu'+i,label:'close-up - '+nm,ci:i},{k:'rx'+i,label:'reaction / listening - '+nm,ci:i});});
 if(chars>=2){for(let i=0;i<names.length;i++){for(let j=i+1;j<names.length;j++){items.push({k:'two'+i+j,label:'two-shot - '+names[i]+' + '+names[j],ci:-1});}}}
 items.push({k:'insert',label:'insert - prop / detail that carries info',ci:-1},{k:'tone',label:'room tone / wild line',ci:-1},{k:'exit',label:'clean exit beat',ci:-1});
 // order for one-actor split shooting: wide, then EVERY angle of each role in one pass, then shared
 const wide=items.filter(function(x){return x.k==='wide';});
 const per=[];names.forEach(function(nm,i){per.push.apply(per,items.filter(function(x){return x.ci===i;}));});

/* ===== POSTER MATCHING =====
   A credit tile only shows art whose scope is exactly credit:<cid>. Posters that
   came in through the library never matched anything, so every credit read empty
   even with dozens of posters on file. Match them by name and attach. */
function normTitle(x){return String(x||'').toLowerCase()
 .replace(/\.[a-z0-9]{2,4}$/,'')            // extension
 .replace(/\b(poster|key ?art|one ?sheet|onesheet|art|cover|logo|title|card|s\d+e\d+|season ?\d+|\d{4})\b/g,'')
 .replace(/[^a-z0-9]+/g,'');}
function titleScore(a,b){
 if(!a||!b)return 0;
 if(a===b)return 1;
 if(a.includes(b)||b.includes(a))return Math.min(a.length,b.length)/Math.max(a.length,b.length);
 return 0;}
function findPosterMatches(){
 const loose=ARTS.filter(a=>(a.type||'').startsWith('image/')
   && (a.category==='poster'||a.scope==='library')
   && !String(a.scope).startsWith('credit:'));
 const out=[];
 loose.forEach(a=>{
  const key=normTitle(a.label||a.filename);
  if(key.length<3)return;
  let best=null,bs=0;
  credits.forEach(c=>{
   const s2=titleScore(key,normTitle(c.title));
   if(s2>bs){bs=s2;best=c;}});
  if(best&&bs>=0.62)out.push({art:a,credit:best,score:bs});});
 return out;}

/* ===== ACTORS ACCESS QUICKSHEET IMPORT =====
   Actors Access has no export. The Quicksheet page is the only place this
   history exists, so the hub reads a saved copy of it (Ctrl+S -> "Webpage,
   Complete" or .mhtml). Six columns: Type, Status, Project, Role, Casting,

function qsText(v){const d=document.createElement('div');d.innerHTML=String(v||'');return (d.textContent||'').replace(/\s+/g,' ').trim();}
function parseQuicksheet(html){
 const MARK='<div class="quicksheet-table-row';
 const chunks=String(html).split(MARK).slice(1);
 const out=[];
 chunks.forEach(raw=>{
  const b=raw.slice(0,6000);
  const g=re=>{const m=b.match(re);return m?qsText(m[1]):'';};
  const rec={
   type:    g(/<p class="quicksheet-badge[^"]*">([\s\S]*?)<\/p>/),
   status:  g(/<p class="quicksheet-status[^"]*">([\s\S]*?)<\/p>/),
   project: g(/<p class="quicksheet-project-name[^"]*">([\s\S]*?)<\/p>/),
   role:    g(/<p class="quicksheet-role-name[^"]*">([\s\S]*?)<\/p>/),
   casting: g(/<p class="quicksheet-casting-name[^"]*">([\s\S]*?)<\/p>/),
   when:    g(/<p class="quicksheet-(?:future|past)-date[^"]*">([\s\S]*?)<\/p>/)
  };
  const cc=b.match(/data-ccid="(\d+)"/); rec.ccid=cc?cc[1]:'';
  const ri=b.match(/result_id=(\d+)/);   rec.rid=ri?ri[1]:'';
  if(rec.project||rec.role||rec.casting)out.push(rec);});

function mhtmlToHtml(txt){
 // an .mhtml is a MIME bundle. Several parts are text/html; the biggest is not
 // necessarily the one with the rows, so pick by content, not by length.
 const parts=String(txt).split(/\r?\n--/);
 const cands=[];
 parts.forEach(p=>{
  if(!/Content-Type:\s*text\/html/i.test(p))return;
  let body=p.replace(/^[\s\S]*?\r?\n\r?\n/,'');
  if(/quoted-printable/i.test(p))body=body.replace(/=\r?\n/g,'').replace(/=([0-9A-F]{2})/gi,(m,h)=>String.fromCharCode(parseInt(h,16)));
  cands.push(body);});
 const withRows=cands.filter(c=>c.indexOf('quicksheet-table-row')>=0);
 if(withRows.length)return withRows.sort((a,b)=>b.length-a.length)[0];
 return cands.sort((a,b)=>b.length-a.length)[0]||String(txt);}
async function importQuicksheet(files){
 let rows=[];
 for(const f of files){
  const txt=await f.text();
  const html=/mhtml|multipart\/related|Content-Type:\s*text\/html/i.test(txt.slice(0,4000))?mhtmlToHtml(txt):txt;
  rows=rows.concat(parseQuicksheet(html));}
 if(!rows.length)return toast('No audition rows found. Save the Auditions page from Actors Access as a complete webpage, then pick that file.');
 // de-dupe against itself and against what is already here
 const have=new Set(projects.map(p=>p.aaid).filter(Boolean));
 const seen=new Set(); let added=0,dup=0;
 rows.forEach(r=>{
  const key=r.rid||[r.project,r.role,r.when].join('|');
  if(seen.has(key)){dup++;return;} seen.add(key);
  if(have.has(key)){dup++;return;}
  const k2=[r.project,r.role,officeKey(r.casting)].map(x=>String(x||'').toLowerCase().replace(/[^a-z0-9]+/g,'')).join('|');
  if(projects.some(p=>p.aaid&&String(p.aaid).indexOf('csv:')===0&&[p.title,p.role,officeKey(p.casting)].map(x=>String(x||'').toLowerCase().replace(/[^a-z0-9]+/g,'')).join('|')===k2)){
   // a CSV row for the same audition: keep it, fill in the date the page has
   const p=projects.find(p=>p.aaid&&String(p.aaid).indexOf('csv:')===0&&[p.title,p.role,officeKey(p.casting)].map(x=>String(x||'').toLowerCase().replace(/[^a-z0-9]+/g,'')).join('|')===k2);
   if(p&&!p.when&&r.when){ p.when=r.when; p.deadline=p.deadline||r.when; }
   dup++;return;}
  const booked=/confirm/i.test(r.status);
  projects.push(newProject({
   aaid:key, title:r.project||'(title withheld)', role:r.role||'',
   casting:r.casting||'', office:r.casting||'',
   type:r.type||'', status:r.status||'', when:r.when||'', deadline:r.when||'',
   kind:'audition', state:booked?'confirmed':'archived'}));
  added++;});
 saveProjects();
 toast('Imported '+added+' audition'+(added===1?'':'s')+(dup?' - skipped '+dup+' already here':''));
 go('offices');}

/* ===== DEADLINE PLAN =====
   From Actor Project Intake v2. A due date tells you nothing; an allocation tells
   you whether to accept. 50/30/10 with hard minimums, remainder as buffer. */
function deadlinePlan(dueISO,nowD){
 if(!dueISO)return {state:'NO_DEADLINE'};
 const due=new Date(dueISO);
 if(isNaN(due))return {state:'UNPARSEABLE',due:dueISO};
 const now=nowD||new Date();
 const hours=Math.max(0,(due-now)/3600000);
 // 50/30/10 with hard minimums AND realistic ceilings - nobody preps a self-tape
 // for 36 hours because the deadline is three days out. Surplus becomes buffer.
 const prep=Math.min(4,Math.max(0.75,hours*0.50));
 const rec =Math.min(2,Math.max(0.50,hours*0.30));
 const edit=Math.min(1.5,Math.max(0.25,hours*0.10));
 const buffer=Math.max(0,hours-prep-rec-edit);
 let risk,why;
 if(hours<=0){risk='PAST DUE';why='Deadline has passed.';}
 else if(hours<prep+rec+edit){risk='HIGH';why='Not enough time left for prep, record and edit at minimums.';}
 else if(buffer<2){risk='MEDIUM';why='Under two hours of buffer.';}
 else {risk='LOW';why='Time allocated with buffer to spare.';}
 return {state:'OK',due:due.toISOString(),hours:Math.round(hours*10)/10,
         prep:Math.round(prep*100)/100,record:Math.round(rec*100)/100,
         edit:Math.round(edit*100)/100,buffer:Math.round(buffer*100)/100,risk,why};}
function hrs(n){if(n==null)return '';return n>=1?(Math.round(n*10)/10)+'h':Math.round(n*60)+'m';}
function planPanel(pl){
 if(!pl||pl.state==='NO_DEADLINE')return '';
 if(pl.state!=='OK')return `<div class="wsgrp"><div class="wsh">Deadline</div><small class="note">${esc(pl.due||'')} could not be read as a date.</small></div>`;
 const col={'PAST DUE':'var(--bad)','HIGH':'var(--bad)','MEDIUM':'var(--tung)','LOW':'var(--good)'}[pl.risk];
 const tot=pl.prep+pl.record+pl.edit+pl.buffer||1;
 const seg=(n,c,l)=>`<i style="width:${Math.max(0,n/tot*100)}%;background:${c}" title="${l} ${hrs(n)}"></i>`;
 return `<div class="wsgrp"><div class="wsh">Time you actually have
   <span style="float:right;color:${col}">${pl.risk}</span></div>
  <div class="allocbar">${seg(pl.prep,'var(--tung)','prep')}${seg(pl.record,'#6a994e','record')}${seg(pl.edit,'#4a7fb5','edit')}${seg(pl.buffer,'var(--line2)','buffer')}</div>
  <div class="allocrow"><span><b>${hrs(pl.prep)}</b> prep</span><span><b>${hrs(pl.record)}</b> record</span><span><b>${hrs(pl.edit)}</b> edit</span><span><b>${hrs(pl.buffer)}</b> buffer</span></div>
  <small class="note">${esc(pl.why)} ${pl.hours?hrs(pl.hours)+' until due.':''}</small></div>`;}

const STATE_MAP={submitted:'SUBMITTED',confirmed:'CONFIRMED',declined:'DECLINED',unconfirmed:'UNCONFIRMED',received:'RECEIVED'};
const STATE_META={
 CONFIRMED:{label:'Confirmed',live:true,note:'They confirmed an appointment. This one is real.'},
 RECEIVED:{label:'Breakdown in',live:true,note:'You have the breakdown. Nothing submitted yet.'},
 UNCONFIRMED:{label:'Unconfirmed',live:true,note:'Submitted, no confirmation yet.'},
 SUBMITTED:{label:'Submitted',live:false,note:'Tape went in. Nothing further to do.'},
 DECLINED:{label:'Declined',live:false,note:'You or your rep passed.'},
 UNKNOWN:{label:'Unknown',live:false,note:''}};
function audState(p){
 const k=String(p.status||'').toLowerCase().trim();
 return STATE_MAP[k]||'UNKNOWN';}
function audIsLive(p){
 const st=STATE_META[audState(p)];
 if(!st||!st.live)return false;

 return (Date.now()-d)/86400000 < 45;   // older than six weeks is history, whatever it says

function ownerGap(p){
 const actor=[],rep=[];
 if(!p.sidesRead)actor.push('Read the sides');
 if(!p.reader)actor.push('Line up a reader');
 if(!p.taped)actor.push('Shoot the tape');
 if(!p.cut)actor.push('Cut and export');

/* ===== RELATIONSHIP GATE =====
   From the Destination Board, attached to the 92 offices the hub already indexes. */
const GATES=['worked_with','warm','seen_you','want','rep_only','cold','do_not_contact'];
const GATE_LABEL={worked_with:'Worked with',warm:'Warm',seen_you:'Has seen you',want:'Want to reach',rep_only:'Rep only',cold:'Cold',do_not_contact:'Do not contact'};
const GATE_COLOR={worked_with:'var(--good)',warm:'var(--tung)',seen_you:'#8FB3D9',want:'#c9a3e0',rep_only:'var(--dim)',cold:'var(--mut)',do_not_contact:'var(--bad)'};
function officeGate(name){
 const k=officeKey(name), m=OFFMETA[k];
 if(m&&m.gate)return m.gate;
 const o=officeFor(name);
 if(o&&o.booked)return 'worked_with';                 // you booked there (a credit, or an audition marked booked)
 if(o&&o.inroom>0)return 'warm';                      // they had you in the room
 if(o&&o.total>=3)return 'seen_you';                  // repeatedly submitted, never in
 if(window.Notes&&Notes.met(name))return 'seen_you';  // you worked in front of them in a class or workshop (NOTES)
 return 'cold';}
function setGate(name,g){const k=officeKey(name);OFFMETA[k]=OFFMETA[k]||{};OFFMETA[k].gate=g;saveOffMeta();drawOffice();render();}
function officeKey(x){return String(x||'').toLowerCase().replace(/\b(casting|cd|office|inc|llc|ltd|and|&|,|\.)\b/g,'').replace(/[^a-z0-9]+/g,'');}
function officeIndex(){
 const idx={};
 const put=(name,rec)=>{
  const k=officeKey(name);if(!k)return;
  const clean=String(name).replace(/[\s.,;]+$/,'').trim();
  if(!idx[k])idx[k]={name:clean,reads:[],credits:[],people:new Set()};
  if(idx[k].name.length<clean.length)idx[k].name=clean;
  if(rec.kind==='credit')idx[k].credits.push(rec);else idx[k].reads.push(rec);
  // officeKey strips the word "casting", so "Claire Simon" and "Claire Simon
  // Casting" collapse together. Compare raw here or real CDs get dropped.
  const flat=x=>String(x||'').toLowerCase().replace(/[^a-z0-9]+/g,'');
  if(rec.who&&flat(rec.who)!==flat(name))idx[k].people.add(rec.who);};
 projects.forEach(p=>{
  const off=p.casting_office||p.casting_director||p.casting;
  if(!off)return;
  put(off,{kind:'read',title:p.title||'',role:p.role||'',status:p.status||p.state||'',outcome:outcomeOf(p),brief:p.brief||'',
    when:p.when||p.deadline||p.received||'',who:p.casting_director||'',id:p.id,type:p.type||'',
    inroom:/^(confirmed|audition)/i.test(String(p.status||'')+' '+String(p.type||'')),
    booked:false});});
 // Bookings come ONLY from a casting office you set on the credit yourself.
 // Inferring them from audition title matches produced 2 hits across 37 credits -
 // the rest of the career predates the Actors Access window - which is not a metric.
 credits.forEach(c=>{
  const off=c.casting;
  if(!off)return;
  put(off,{kind:'credit',title:c.title||'',role:c.character||c.role||'',who:'',cid:c.cid,when:c.year||''});});
 Object.keys(OFFMETA||{}).forEach(k=>{ const m=OFFMETA[k]; if(m&&m.name&&!idx[k]) idx[k]={name:m.name,reads:[],credits:[],people:new Set()}; });
 // casting you were in a room with (NOTES: a class, a workshop, a callback) is on the list even with no reads
 try{ if(window.Notes) Notes.people().filter(p=>p.role==='casting'&&p.sessions).forEach(p=>{ const k=officeKey(p.name); if(k&&!idx[k]) idx[k]={name:p.name,reads:[],credits:[],people:new Set()}; }); }catch(e){}
 return Object.keys(idx).filter(k=>!(OFFMETA[k]&&OFFMETA[k].hidden)).map(k=>{const o=idx[k];
   (OFFMETA[k]&&OFFMETA[k].people||[]).forEach(x=>o.people.add(x));
   o.note=(OFFMETA[k]&&OFFMETA[k].note)||'';
   o.why=(OFFMETA[k]&&OFFMETA[k].why)||''; o.cast=(OFFMETA[k]&&OFFMETA[k].cast)||[]; o.sources=(OFFMETA[k]&&OFFMETA[k].sources)||[]; o.researched=(OFFMETA[k]&&OFFMETA[k].researched)||'';
   o.people=Array.from(o.people).filter(Boolean);
   o.total=o.reads.length+o.credits.length;
   o.booked=o.credits.length+o.reads.filter(r=>r.outcome&&r.outcome.booked).length;
   o.callbacks=o.reads.filter(r=>r.outcome&&r.outcome.callback).length;
   o.pinned=o.reads.filter(r=>r.outcome&&r.outcome.pinned).length;
   o.briefs=o.reads.filter(r=>r.brief).length;
   o.inroom=o.reads.filter(r=>r.inroom).length;
   o.tapes=o.reads.length-o.inroom;
   o.rate=o.total?Math.round(100*o.booked/o.total):0;
   o.last=o.reads.map(r=>r.when).filter(Boolean).sort().slice(-1)[0]||'';
   return o;})
  .sort((a,b)=>b.total-a.total||a.name.localeCompare(b.name));}

/* ===== ARTWORK: fill every credit in one pass =====
   Searches TMDb by title rather than going through an IMDb person lookup, because
   the person route misses older co-star work while the title route finds the show. */
var artRun={busy:false,done:0,total:0,log:[],stop:false};
function cleanTitle(t){
 return String(t||'')
  .replace(/\((?:pilot|tv|film|short|movie)\)/ig,'')
  .replace(/\bep\.?\s*#?\d+.*$/i,'')
  .replace(/[",]/g,' ')
  .replace(/\s+/g,' ').trim();}
async function tmdbSearch(title,medium){
 const kind=medium==='Film'?'movie':'tv';
 const q=new URLSearchParams({api_key:TMDB_KEY,query:cleanTitle(title),include_adult:'false'});
 const r=await fetch(`https://api.themoviedb.org/3/search/${kind}?`+q);
 if(!r.ok)throw new Error(r.status===401?'TMDb key rejected':'TMDb '+r.status);
 const d=await r.json();
 let hits=(d.results||[]).filter(x=>x.poster_path);
 if(!hits.length){ // try the other medium - pilots and TV movies get filed either way
  const k2=kind==='tv'?'movie':'tv';
  const r2=await fetch(`https://api.themoviedb.org/3/search/${k2}?`+q);
  if(r2.ok){const d2=await r2.json();hits=(d2.results||[]).filter(x=>x.poster_path);}}
 if(!hits.length)return null;
 const want=cleanTitle(title).toLowerCase();
 hits.sort((a,b)=>{
  const an=(a.name||a.title||'').toLowerCase(), bn=(b.name||b.title||'').toLowerCase();
  const ax=an===want?0:1, bx=bn===want?0:1;
  return ax-bx || (b.popularity||0)-(a.popularity||0);});
 return hits[0];}
async function fetchArtwork(){
 if(!TMDB_KEY)return toast('Add a free TMDb key first - the field is right below');
 const need=credits.filter(c=>!ARTS.some(a=>String(a.scope)==='credit:'+c.cid&&a.category==='poster'));
 if(!need.length)return toast('Every credit already has artwork');
 artRun={busy:true,done:0,total:need.length,log:[],stop:false};render();
 for(const c of need){
  if(artRun.stop)break;
  try{
   const hit=await tmdbSearch(c.title,c.medium);
   if(!hit){artRun.log.push({title:c.title,ok:false,why:'no match on TMDb'});}
   else{
    const resp=await fetch(TMDB_IMG+'w500'+hit.poster_path);
    if(!resp.ok)throw new Error('image '+resp.status);
    const b=await resp.blob();
    const rec={id:'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
      filename:normTitle(c.title)+'.jpg',label:c.title+' key art',category:'poster',
      scope:'credit:'+c.cid,type:b.type||'image/jpeg',size:b.size,blob:b,
      added:new Date().toISOString(),src:'TMDb'};
    await DB.put(rec);ARTS.push(rec);
    artRun.log.push({title:c.title,ok:true,matched:hit.name||hit.title,year:String(hit.first_air_date||hit.release_date||'').slice(0,4)});
    if(!c.year&&(hit.first_air_date||hit.release_date))c.year=String(hit.first_air_date||hit.release_date).slice(0,4);}
  }catch(e){artRun.log.push({title:c.title,ok:false,why:e.message});}
  artRun.done++;render();
  await new Promise(r=>setTimeout(r,120));   // stay under TMDb rate limits
 }
 artRun.busy=false;saveCredits();
 const got=artRun.log.filter(x=>x.ok).length;
 toast('Artwork: '+got+' of '+artRun.total+' found'+(got<artRun.total?' - the rest need a paste':''));
 render();}
function dropArtless(){
 const gone=credits.filter(c=>!ARTS.some(a=>String(a.scope)==='credit:'+c.cid&&a.category==='poster'));
 if(!gone.length)return toast('Every credit has artwork');

function creditCard(c,i){

var vaultDir=null, vaultOn=false;
function vaultSupported(){return typeof window!=='undefined' && 'showDirectoryPicker' in window;}
async function vaultRemember(h){try{const db=await DB.open();await new Promise((res,rej)=>{const tx=db.transaction('meta','readwrite');tx.objectStore('meta').put({k:'vaultDir',v:h});tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});}catch(e){}}
async function vaultRecall(){try{const h=await DB.getMeta('vaultDir');return h||null;}catch(e){return null;}}
async function vaultPick(){
 if(!vaultSupported())return toast('This browser cannot open folders - use Chrome or Edge');
 try{const h=await window.showDirectoryPicker({mode:'readwrite',id:'projecthub'});
  vaultDir=h;await vaultRemember(h);vaultOn=true;
  toast('Vault linked. Loading...');await vaultLoad();await vaultSaveAll();render();
 }catch(e){if(e&&e.name!=='AbortError')toast('Could not link folder: '+e.message);}}
async function vaultUnlink(){vaultDir=null;vaultOn=false;try{await DB.putMeta('vaultDir',null);}catch(e){}toast('Vault unlinked');render();}
async function vaultReady(){
 if(vaultDir){const p=await vaultDir.queryPermission({mode:'readwrite'});if(p==='granted')return true;
  const r=await vaultDir.requestPermission({mode:'readwrite'});return r==='granted';}
 return false;}
async function vaultAuto(){
 if(!vaultSupported())return;
 const h=await vaultRecall();if(!h)return;
 vaultDir=h;
 const p=await h.queryPermission({mode:'readwrite'});
 if(p==='granted'){vaultOn=true;await vaultLoad();}
 else{vaultOn=false;}   // needs one click to re-grant
}
async function vaultReconnect(){
 if(!vaultDir)return vaultPick();
 const ok=await vaultReady();
 if(ok){vaultOn=true;toast('Vault reconnected');await vaultLoad();render();}
 else toast('Permission denied');}
async function vaultDirFor(sub){const root=vaultDir;return await root.getDirectoryHandle(sub,{create:true});}
async function vaultSaveAll(){
 if(!await vaultReady())return;
 try{
  const md=await vaultDirFor('media');
  let n=0;
  for(const a of ARTS){ if(!a.blob)continue;
   const nm=a.id+'__'+(a.filename||'file').replace(/[^\w.\-]+/g,'_');
   try{const fh=await md.getFileHandle(nm,{create:true});const w=await fh.createWritable();await w.write(a.blob);await w.close();n++;}catch(e){}}
  /* One payload, built in one place. This used to assemble its own four-key object,
     so linking a folder - which calls this immediately - would write a file missing
     the tombstones, the office notes, the standup and training logs and the TMDB key,
     stripping them back out seconds after they were read in. */
  const fh=await vaultDir.getFileHandle('hub.json',{create:true});
  const w=await fh.createWritable();await w.write(new Blob([JSON.stringify(vaultPayload())],{type:'application/json'}));await w.close();
  vaultStamp=new Date();vaultDirty=false;paintVaultPill();
  try{await DB.putMeta('localAt',vaultStamp.toISOString());}catch(e){}
  return n;
 }catch(e){toast('Vault write failed: '+e.message);}}
async function vaultSaveOne(a){
 if(!vaultOn||!a||!a.blob)return;
 try{if(!await vaultReady())return;
  const md=await vaultDirFor('media');
  const nm=a.id+'__'+(a.filename||'file').replace(/[^\w.\-]+/g,'_');
  const fh=await md.getFileHandle(nm,{create:true});const w=await fh.createWritable();await w.write(a.blob);await w.close();
  await vaultSaveMeta();

/* Everything the app keeps, in one place.

   hub.json used to carry four things - profile, credits, projects and an index of
   the media. The other six lived only in browser storage: the tombstones for credits
   you deleted, the notes and people you have logged against each casting office, the
   standup material, the training log, the TMDB key. Clear your browser and those were
   simply gone, with a folder on disk sitting there looking like a backup.

   offmeta is the one that mattered. Notes on 93 casting offices are not something you
   can reconstruct from memory. */
function vaultPayload(){
 return {v:2, at:new Date().toISOString(),
  profile:profile, credits:credits, projects:projects,
  creditTombs:(typeof CREDIT_TOMBS!=='undefined'?CREDIT_TOMBS:[]),
  offmeta:(typeof OFFMETA!=='undefined'?OFFMETA:{}),
  standup:(typeof standup!=='undefined'?standup:null),
  train:(typeof train!=='undefined'?train:null),
  tmdbkey:(typeof TMDB_KEY!=='undefined'?TMDB_KEY:''),
  demoCleared:(typeof DEMO_CLEARED!=='undefined'?!!DEMO_CLEARED:false),
  arts:ARTS.map(a=>({id:a.id,filename:a.filename,label:a.label,category:a.category,scope:a.scope,type:a.type,tag:a.tag,added:a.added,dur:a.dur}))};
}
async function vaultSaveMeta(){
 if(!vaultOn)return;
 try{
  const fh=await vaultDir.getFileHandle('hub.json',{create:true});
  const w=await fh.createWritable();
  await w.write(new Blob([JSON.stringify(vaultPayload())],{type:'application/json'}));
  await w.close();
  vaultStamp=new Date();
  vaultDirty=false; paintVaultPill();
  try{await DB.putMeta('localAt',vaultStamp.toISOString());}catch(e){}
 }catch(e){}}

/* What the two sides hold, in numbers you can compare at a glance. */
function vaultCount(o){
 if(!o)return null;
 return {cr:(o.credits||[]).length, pr:(o.projects||[]).length,
  ar:(o.arts||[]).length, nm:((o.profile||{}).name||'').trim(),

 if(!a||!b)return false;

/* Apply a hub.json wholesale. Only called once we know we want it. */
async function vaultApply(meta){
 if(meta.profile){profile=meta.profile;await DB.putMeta('profile',profile);}
 if(meta.credits){credits=meta.credits;ensureCids();await DB.putMeta('credits',credits);}
 if(meta.projects){projects=meta.projects;await DB.putMeta('projects',projects);}
 if(meta.creditTombs){CREDIT_TOMBS=meta.creditTombs;await DB.putMeta('creditTombs',CREDIT_TOMBS);}
 if(meta.offmeta){OFFMETA=meta.offmeta;await DB.putMeta('offmeta',OFFMETA);}
 if(meta.standup&&meta.standup.items){standup=meta.standup;await DB.putMeta('standup',standup);}
 if(meta.train&&meta.train.log){train=meta.train;await DB.putMeta('train',train);}
 if(meta.tmdbkey){TMDB_KEY=meta.tmdbkey;await DB.putMeta('tmdbkey',TMDB_KEY);}
 if(meta.demoCleared){DEMO_CLEARED=true;await DB.putMeta('demoCleared',true);}
}

async function vaultLoad(){
 if(!await vaultReady())return;
 try{
  var meta=null;
  try{var fh=await vaultDir.getFileHandle('hub.json');var f=await fh.getFile();meta=JSON.parse(await f.text());}catch(e){}

  if(meta){
   /* The folder and the browser can disagree - you worked on another machine, or
      cleared this browser, or two windows were open. The old code resolved that
      silently in the folder's favour and overwrote whatever was here. If the two
      differ in anything countable, you choose. */
   var vc=vaultCount(meta);
   var lc=vaultCount({credits:credits,projects:projects,profile:profile,offmeta:OFFMETA,arts:ARTS});
   var localAt=null; try{localAt=await DB.getMeta('localAt');}catch(e){}
   /* Demo data is not your data. A new install is carrying Riley Hart and six
      invented credits, and without this the first folder you link would ask you
      to choose between your real career and the sample. The folder always wins
      over a demo. */
   var fresh=(!lc.cr&&!lc.pr&&!lc.off&&!lc.nm)||(typeof isDemo==='function'&&isDemo());
   var take='vault';

   if(!fresh&&!vaultSame(vc,lc)){
    var vWhen=meta.at?new Date(meta.at).toLocaleString():'unknown';
    var lWhen=localAt?new Date(localAt).toLocaleString():'unknown';
    take=confirm(
      'The folder and this browser hold different things.\n\n'+
      'FOLDER (click OK to use this)\n   '+vaultDesc(vc,vWhen)+'\n\n'+
      'THIS BROWSER (click Cancel to keep this)\n   '+vaultDesc(lc,lWhen)+'\n\n'+
      'Whichever you pick becomes the record and the other is overwritten.'
    )?'vault':'local';
   }

   if(take==='vault'){
    await vaultApply(meta);
   }else{
    /* Keep the browser. Write it out straight away so the two agree and you are
       not asked this again on the next boot. */
    vaultOn=true;
    await vaultSaveMeta();
    toast('Kept this browser; folder updated to match');
   }
  }

  var byId={};((meta&&meta.arts)||[]).forEach(function(a){byId[a.id]=a;});
  var md=null;try{md=await vaultDir.getDirectoryHandle('media');}catch(e){vaultOn=true;return;}
  var have=new Set(ARTS.map(function(a){return a.id;}));
  var loaded=0;
  for await (const [name,h] of md.entries()){
   if(h.kind!=='file')continue;
   var id=name.split('__')[0];
   if(have.has(id))continue;
   try{var ff=await h.getFile();var m=byId[id]||{};
    var rec=Object.assign({id:id,filename:name.split('__').slice(1).join('__')||name,category:'other',scope:'library'},m,{id:id,blob:ff,type:m.type||ff.type||''});
    ARTS.push(rec);loaded++;
    try{await DB.put(rec);}catch(_){}
   }catch(e){}}
  vaultOn=true;
  if(loaded)toast('Vault: loaded '+loaded+' file'+(loaded===1?'':'s'));
 }catch(e){toast('Vault read failed: '+e.message);}}

/* ===== PUBLISH =====
   A file you attach and a page you host need different things. og:image cannot be
   a data URI - crawlers reject it - so hosting mode emits a real share card
   alongside the HTML. */
function makeShareCard(headBlob,name,lane){return new Promise(res=>{
 const c=document.createElement('canvas');c.width=1200;c.height=630;
 const x=c.getContext('2d');
 x.fillStyle='#16161A';x.fillRect(0,0,1200,630);
 const draw=img=>{
  if(img){ // headshot on the right third, faded into the panel
   const s=Math.max(520/img.width,630/img.height);
   const w=img.width*s,h=img.height*s;
   x.save();x.beginPath();x.rect(680,0,520,630);x.clip();
   x.drawImage(img,680+(520-w)/2,(630-h)/2,w,h);
   const g=x.createLinearGradient(680,0,900,0);
   g.addColorStop(0,'#16161A');g.addColorStop(1,'rgba(22,22,26,0)');
   x.fillStyle=g;x.fillRect(680,0,240,630);x.restore();}
  x.fillStyle='#D2694E';x.fillRect(0,0,1200,10);
  x.fillStyle='#F2F0EA';
  x.font='800 74px -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif';
  const parts=String(name||'').toUpperCase().split(' ');
  let line1=parts.slice(0,-1).join(' ')||parts[0], line2=parts.length>1?parts[parts.length-1]:'';
  x.fillText(line1,64,250);
  if(line2)x.fillText(line2,64,332);
  x.fillStyle='#8FB3D9';
  x.font='500 26px ui-monospace,Menlo,Consolas,monospace';
  const ln=String(lane||'').split(/\s+[\u00b7|\u2013\u2014-]\s+|,/).map(t=>t.trim()).filter(Boolean).slice(0,3).join('  \u00b7  ');
  x.fillText(ln.toUpperCase(),64,390);
  x.fillStyle='#6E6A63';
  x.font='400 22px ui-monospace,Menlo,Consolas,monospace';
  x.fillText('ACTOR',64,586);
  c.toBlob(b=>res(b),'image/jpeg',0.9);};
 if(!headBlob)return draw(null);
 const img=new Image();const u=URL.createObjectURL(headBlob);
 img.onload=()=>{URL.revokeObjectURL(u);draw(img);};
 img.onerror=()=>{URL.revokeObjectURL(u);draw(null);};
 img.src=u;})}

/* ===== SITE ZIP =====
   Two different artifacts. The emailed file bakes video in as base64 so it works
   with no internet - which is why it gets huge. A hosted site should not do that:
   the browser streams video from separate files, so the page stays a few hundred
   KB and loads instantly. Same HTML generator, different media handling. */
function safeName(x){return String(x||'file').replace(/[^\w.-]+/g,'_').slice(0,60);}
/* the website's files: index.html, share.jpg, media/. Used by the zip and by PUT IT ONLINE */
async function siteEntries(site){
  const entries=[]; const enc=new TextEncoder();
  const uniq=nm=>{ if(!entries.some(e=>e.name===nm)) return nm; const m=nm.match(/^(.*?)(\.[^.\/]+)?$/); for(let i=2;;i++){ const t=m[1]+'_'+i+(m[2]||''); if(!entries.some(e=>e.name===t)) return t; } };
  const asData=async id=>{const a=ARTS.find(x=>x.id===id);if(!a||!a.blob)return null;
    return {u:await blobToDataURL(a.blob),t:a.type||'',n:a.label||a.filename||''};};
  // video goes out as its own file and is referenced by path
  const asFile=async (id,dir)=>{const a=ARTS.find(x=>x.id===id);if(!a||!a.blob)return null;
    const nm=uniq((dir||'media')+'/'+safeName(a.label||a.filename||a.id)+'.'+(((a.filename||'x').split('.').pop()||'mp4').toLowerCase()));
    entries.push({name:nm,data:new Uint8Array(await a.blob.arrayBuffer()),type:a.type||''});
    return {u:nm,t:a.type||'',n:a.label||a.filename||'',
            poster:(THUMBS[a.id]||a.thumb||'')||undefined};};
  const head=await asData(pkgSel.headshot);
  const res =await asData(pkgSel.resume);
  const reel=pkgSel.reel?await asFile(pkgSel.reel,'media'):null;
  const about=pkgSel.about?await asFile(pkgSel.about,'media'):null;
  const underCredit=new Set(ARTS.filter(a=>a.category==='clip'&&pkgSel.credits.some(cid=>String(a.scope)==='credit:'+cid)).map(a=>a.id));
  const clips=[];for(const id of pkgSel.clips){ if(underCredit.has(id)) continue; const g=await asFile(id,'media');if(g)clips.push(g);}
  const auds=[];for(const id of pkgSel.auditions){const g=await asFile(id,'media');if(g){const a=ARTS.find(x=>x.id===id);g.who=(a&&a.tag)||'';auds.push(g);}}
  const monos=[];for(const id of pkgSel.monologues){const g=await asFile(id,'media');if(g){const a=ARTS.find(x=>x.id===id);g.kind=(a&&a.category==='standup_vid')?'Stand-Up':'Monologue';monos.push(g);}}
  const cr=[];
  for(const cid of pkgSel.credits){const c=credits.find(x=>x.cid===cid);if(!c)continue;
   const po=ARTS.find(a=>String(a.scope)==='credit:'+cid&&a.category==='poster');
   const cc=[]; for(const a of ARTS.filter(a=>String(a.scope)==='credit:'+cid&&a.category==='clip'&&(a.type||'').startsWith('video/'))){ const g=await asFile(a.id,'media'); if(g) cc.push(g); }
   cr.push({title:c.title,role:c.role,net:c.net,character:c.character||'',director:c.director||'',
            charNote:c.charNote||'',poster:po?await asData(po.id):null,clips:cc});}
  const doc=packageHTML(Object.assign(await pkgExtras('file',entries),{profile,note:pkgSel.note,contact:pkgSel.contact,head,res,reel,about,
    clips,auds,monos,credits:cr,site:site,ogfile:'share.jpg',
    showLane:!!pkgSel.showLane,showSkills:!!pkgSel.showSkills}));
  entries.unshift({name:'index.html',data:enc.encode(doc)});
  const hs=ARTS.find(a=>a.id===pkgSel.headshot);
  const card=await makeShareCard(hs&&hs.blob,profile.name,profile.lane);
  if(card)entries.push({name:'share.jpg',data:new Uint8Array(await card.arrayBuffer())});
  return entries;
}
async function buildSiteZip(){
 const site=(pkgSel.site||'').trim();
 if(!site)return toast('Add your site address first');
 pkgBaking=true;render();
 try{
  const entries=await siteEntries(site), enc=new TextEncoder();
  entries.push({name:'README.txt',data:enc.encode(
    'Upload everything in this folder to the root of '+site+'\n\n'
   +'  index.html   the page\n  share.jpg    the preview image for links\n  media/       video\n\n'
   +'Keep the folder structure. index.html points at media/ by relative path.\n')});

/* ===== DEMO DATA =====
   A hub with nothing in it teaches nobody what 27 panels are for, so a first run
   arrives with an invented actor in it - six credits, ten auditions, a profile.
   Every piece of it is tagged, so clearing it is exact: it takes out what shipped
   and leaves anything you have added alone. The banner stays up until it is gone,
   because the one unforgivable outcome is sending a package out with a fictional
   person's credits still in it. */
function isDemo(){
 if(profile&&profile.demo)return true;
 if((credits||[]).some(c=>c.demo))return true;
 if((projects||[]).some(p=>p.aaid&&String(p.aaid).indexOf('D1')===0))return true;
 return false;
}
function demoBanner(){
 if(!isDemo())return '';
 return `<div class="panel" style="border-color:var(--tung);background:rgba(224,162,60,.07)">
  <h2 style="color:var(--tung)">You are looking at demo data</h2>
  <small class="note">RILEY HART is invented, and so are the credits, the auditions and
   the casting offices. It is here so the hub has something to show you. Clear it when you
   are ready to put your own work in - anything you have added yourself is kept.</small>
  <div class="row" style="padding:0;margin-top:10px">
   <button class="act sm" onclick="clearDemo()">Clear the demo data</button></div></div>`;
}
/* The drop itself, with no prompt, so a restore can use it too. skills and accents
   are ARRAYS - this reset wrote them as empty strings, which only avoided crashing
   the Profile tab because '' is falsy and (p.skills||[]) fell through to an array.
   Anything other than empty would have hit (p.skills||[]).join is not a function. */
async function dropDemoData(){
 credits=(credits||[]).filter(c=>!c.demo);
 projects=(projects||[]).filter(p=>!(p.aaid&&String(p.aaid).indexOf('D1')===0));
 if(profile&&profile.demo){
  profile={name:'',union:'',rep:'',phone:'',locals:'',height:'',weight:'',lane:'',skills:[],accents:[]};
 }
 DEMO_CLEARED=true;
 try{await DB.putMeta('demoCleared',true);}catch(e){}
 try{await saveCredits();await saveProjects();await saveProfile();}catch(e){}
}
async function clearDemo(){
 if(!confirm('Remove the demo actor, the six demo credits and the ten demo auditions?\n\n'
  +'Anything you have added yourself stays.'))return;
 await dropDemoData();
 toast('Demo data cleared');render();
}

function nextAud(){
 const now=Date.now(), live=projects.filter(x=>(x.aaid||x.kind==='audition')&&x.state!=='archived'&&audIsLive(x));
 const t=x=>{const d=new Date(x.deadline||x.dueISO||'');return isNaN(d)?null:d.getTime();};
 const ahead=live.filter(x=>t(x)!==null&&t(x)>now).sort((a,b)=>t(a)-t(b));
 if(ahead.length)return ahead[0];
 return live.filter(x=>t(x)===null).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')))[0]||null;
}

/* ===== ARTIFACTS: local IndexedDB store (offline, persists, holds big media) ===== */
const DB={_p:null,open(){if(typeof indexedDB==='undefined')return Promise.reject(new Error('no-idb'));if(!this._p)this._p=new Promise((res,rej)=>{const r=indexedDB.open('colmac_hub',2);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('art'))d.createObjectStore('art',{keyPath:'id'});if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta',{keyPath:'k'});};r.onsuccess=e=>res(e.target.result);r.onerror=()=>rej(r.error);});return this._p;},
 async getMeta(k){try{const db=await this.open();return await new Promise((res)=>{const q=db.transaction('meta','readonly').objectStore('meta').get(k);q.onsuccess=()=>res(q.result?q.result.v:null);q.onerror=()=>res(null);});}catch(e){return null;}},
 async putMeta(k,v){try{const db=await this.open();return await new Promise((res)=>{const tx=db.transaction('meta','readwrite');tx.objectStore('meta').put({k,v});tx.oncomplete=res;tx.onerror=res;});}catch(e){return null;}},
 async put(rec){const db=await this.open();return await new Promise((res,rej)=>{const tx=db.transaction('art','readwrite');tx.objectStore('art').put(rec);tx.oncomplete=res;tx.onerror=()=>rej(tx.error||new Error('write failed'));tx.onabort=()=>rej(tx.error||new Error('write aborted - storage full'));});},
 async all(){try{const db=await this.open();return await new Promise((res,rej)=>{const tx=db.transaction('art','readonly');const q=tx.objectStore('art').getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error);});}catch(e){return [];}},
 async del(id){try{const db=await this.open();return await new Promise((res,rej)=>{const tx=db.transaction('art','readwrite');tx.objectStore('art').delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});}catch(e){return null;}}};

 const cs=canvas.captureStream(30);const mixed=new MediaStream([...cs.getVideoTracks(),...dest.stream.getAudioTracks()]);
 let rec;try{rec=new MediaRecorder(mixed,{mimeType:mime,videoBitsPerSecond:reel.bitrate});}catch(e){return null;}
 const chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
 const done=new Promise(r=>{rec.onstop=()=>r(new Blob(chunks,{type:mime.split(';')[0]}));});
 let drawing=true;(function d(){if(!drawing)return;if(v.readyState>=2&&v.videoWidth){const r=Math.max(W/v.videoWidth,H/v.videoHeight);const dw=v.videoWidth*r,dh=v.videoHeight*r;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);ctx.drawImage(v,(W-dw)/2,(H-dh)/2,dw,dh);}requestAnimationFrame(d);})();
 const url=URL.createObjectURL(srcBlob);v.src=url;
 await new Promise(res=>{v.onloadedmetadata=res;v.onerror=res;setTimeout(res,2000);});
 if(!outSec||outSec<=inSec)outSec=v.duration||inSec+10;
 try{await AC.resume();}catch(e){}
 v.currentTime=inSec;await new Promise(res=>{v.onseeked=res;setTimeout(res,600);});
 rec.start(200);try{await v.play();}catch(e){}
 await new Promise(res=>{let done2=false;const stop=()=>{if(done2)return;done2=true;res();};
   v.ontimeupdate=()=>{const span=Math.max(0.1,outSec-inSec);setBake('Cutting '+Math.round(Math.min(span,v.currentTime-inSec))+'s / '+Math.round(span)+'s',Math.min(100,Math.round((v.currentTime-inSec)/span*100)));if(v.currentTime>=outSec)stop();};
   v.onended=stop;});
 v.pause();drawing=false;setTimeout(()=>{try{rec.stop();}catch(e){}},200);
 const out=await done;try{AC.close();}catch(e){}URL.revokeObjectURL(url);return out;}
async function cutClip(){
 const m=ARTS.find(a=>a.id===clipping.masterId);if(!m||baking)return;
 const v=document.getElementById('mastervid');let inSec=clipping.inSec,outSec=clipping.outSec;
 if(!outSec||outSec<=inSec)outSec=(v&&v.duration)?v.duration:inSec+10;
 if(outSec-inSec<0.3)return toast('Set an OUT point after the IN point');
 const name=((document.getElementById('clipname')||{}).value||(m.label+' clip')).trim();
 baking=true;render();
 const blob=await recordSpan(m.blob,inSec,outSec);
 if(blob){const ext=blob.type.includes('mp4')?'mp4':'webm';const id='a'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const file=new File([blob],name.replace(/[^a-z0-9]+/gi,'_')+'.'+ext,{type:blob.type});
  const rec={id,scope:'library',category:'clip',label:name,filename:file.name,type:file.type,size:file.size,added:new Date().toISOString(),blob:file,tag:''};
  try{await DB.put(rec);ARTS.push(rec);toast('Clip cut: '+name);}catch(e){toast('Clip cut but too large to store - downloading');downloadBlob(blob,file.name);}}
 baking=false;setBake('',0);render();}
function promoteMaster(id){const a=ARTS.find(x=>x.id===id);if(a){a.category='master';DB.put(a);toast('Promoted to master reel');render();}}

function reelRoomView(){
 const masters=ARTS.filter(a=>a.category==='master'&&(a.type||'').startsWith('video/')&&(a.scope==='library'||String(a.scope).startsWith('credit:')));
 const pool=ARTS.filter(a=>a.category==='clip'&&(a.type||'').startsWith('video/')&&(a.scope==='library'||String(a.scope).startsWith('credit:')));
 const reels=ARTS.filter(a=>a.category==='reel');
 let h=`<div class="panel"><h2>Reel Room &middot; masters &rarr; clips &rarr; reels</h2>
  <small class="note">Three tiers: master reels on file are your source; carve clips from a master (or upload clips you already have); build new reels from the clips. Cutting and baking render in real time, frame-approximate, reel/feeler grade (`+(pickMime().includes('mp4')?'MP4':'WebM')+`), all on your machine. For a frame-exact finish, use your editor.</small></div>`;
 h+=`<div class="panel dz" data-scope="library" data-cat="master"><h2>Master reels on file &middot; ${masters.length} available<button class="act sm" style="float:right;margin-top:-3px" onclick="pickFiles('library','master')">+ Upload master</button></h2>`;
 h+=masters.length?`<div class="artgrid" style="padding:13px">`+masters.map(a=>`<div class="art"><div class="artmedia">${videoTile(a,200)}</div>
   <input class="artlabel" value="${esc(a.label)}" onchange="relabel('${a.id}',this.value)">
   <div style="margin:4px 0"><span class="tag" style="color:var(--go);border-color:var(--go)">&#9679; available</span></div>
   <div class="row" style="padding:0;gap:5px"><button class="act sm" style="flex:1" onclick="openClipper('${a.id}')">Make clip</button><button class="x" onclick="delArt('${a.id}')">&times;</button></div></div>`).join('')+`</div>`
   :`<div class="empty">No master reels yet. Upload your full reel(s) - they become the source you carve clips from.</div>`;
 h+=`</div>`;
 if(clipping.masterId){const m=ARTS.find(a=>a.id===clipping.masterId);if(m){
   h+=`<div class="panel"><h2>Make clip from: ${esc(m.label)}<button class="ghost act sm" style="float:right;margin-top:-3px" onclick="closeClipper()">Done</button></h2><div style="padding:13px">
    <video id="mastervid" src="${artURL(m)}" controls preload="auto" style="width:100%;max-height:340px;background:#000;border-radius:6px"></video>
    <div class="row" style="padding:11px 0 4px;gap:8px;flex-wrap:wrap"><button class="ghost act sm" onclick="setIn()">Set IN</button><span class="tag">IN <b id="inlbl">${fmt(clipping.inSec)}</b></span><button class="ghost act sm" onclick="setOut()">Set OUT</button><span class="tag">OUT <b id="outlbl">${clipping.outSec?fmt(clipping.outSec):'end'}</b></span></div>
    <div class="row" style="padding:0;gap:8px"><input id="clipname" placeholder="clip name" style="max-width:240px"><button class="act" onclick="cutClip()" ${baking?'disabled':''}>${baking?'Cutting&hellip;':'Cut clip'}</button><span id="bakestat" style="color:var(--tung);font-size:11px"></span></div>
    ${baking?`<div class="bakebar"><i id="bakefill"></i></div>`:''}
    <small class="note">Scrub the master, Set IN, scrub to the end of the moment, Set OUT, then Cut. It records that stretch in real time into a new clip in the pool below.</small></div></div>`;}}
 h+=`<div class="panel dz" data-scope="library" data-cat="clip"><h2>Clip pool &middot; ${pool.length}<button class="act sm" style="float:right;margin-top:-3px" onclick="pickFiles('library','clip')">+ Upload clip</button></h2>`;
 h+=pool.length?`<div class="artgrid" style="padding:13px">`+pool.map(a=>`<div class="art"><div class="artmedia">${videoTile(a,200)}</div>
   <input class="artlabel" value="${esc(a.label)}" onchange="relabel('${a.id}',this.value)">
   <select class="arttag" onchange="setTag('${a.id}',this.value)"><option value=""${!a.tag?' selected':''}>tag&hellip;</option><option value="audition"${a.tag==='audition'?' selected':''}>audition tape</option><option value="work_sample"${a.tag==='work_sample'?' selected':''}>work sample</option></select>
   <div class="row" style="padding:0;gap:5px;margin-top:5px"><button class="act sm" style="flex:1" onclick="addToReel('${a.id}')">+ Add to reel</button><button class="x" onclick="delArt('${a.id}')">&times;</button></div></div>`).join('')+`</div>`
   :`<div class="empty">No clips yet. Carve one from a master above, or upload clips you already have.</div>`;
 h+=`</div>`;
 h+=`<div class="panel"><h2>Build a reel</h2><div class="form"><div class="row" style="padding:0;gap:8px"><input id="reelname" placeholder="reel name - e.g. Law Enforcement 2026" value="${esc(reel.name)}" oninput="reel.name=this.value" style="max-width:300px"><select onchange="reel.bitrate=+this.value" style="max-width:190px"><option value="1000000"${reel.bitrate===1000000?' selected':''}>Small &middot; 1 Mbps</option><option value="2500000"${reel.bitrate===2500000?' selected':''}>Medium &middot; 2.5 Mbps</option><option value="5000000"${reel.bitrate===5000000?' selected':''}>High &middot; 5 Mbps</option></select></div>`;
 if(!reel.ids.length)h+=`<div class="matempty">No clips in the reel yet - add from the pool above.</div>`;
 else h+=`<div style="display:grid;gap:7px">`+reelClips().map((c,i)=>`<div class="reelrow"><span class="num">${i+1}</span><span class="rl">${esc(c.label)}</span><button class="x" onclick="moveReel(${i},-1)">&#9650;</button><button class="x" onclick="moveReel(${i},1)">&#9660;</button><button class="x" onclick="rmFromReel(${i})">&times;</button></div>`).join('')+`</div>`;
 h+=`<div class="row" style="padding-top:12px"><button class="act" onclick="bakeReel()" ${baking?'disabled':''}>${baking?'Baking&hellip;':'Bake reel'}</button><span id="bakestat2" style="color:var(--tung);font-size:11px"></span></div>`;
 if(baking&&!clipping.masterId)h+=`<div class="bakebar"><i id="bakefill"></i></div><small class="note">Real-time render - leave this tab open.</small>`;
 h+=`</div></div>`;
 if(reels.length){h+=`<div class="panel"><h2>Your reels &middot; ${reels.length}</h2><div class="artgrid" style="padding:13px">`+reels.map(a=>`<div class="art"><div class="artmedia">${videoTile(a,200)}</div>
   <input class="artlabel" value="${esc(a.label)}" onchange="relabel('${a.id}',this.value)">
   <div class="row" style="padding:0;gap:5px;margin-top:4px"><button class="act sm" style="flex:1" onclick="exportReel('${a.id}')">Export</button><button class="ghost act sm" onclick="promoteMaster('${a.id}')" title="make this a source master">&uarr; Master</button><button class="x" onclick="delArt('${a.id}')">&times;</button></div></div>`).join('')+`</div></div>`;}
 $('view').innerHTML=h;
}

/* The folder is read before anything is decided. It used to run dead last, after
   the demo auditions had been seeded and deleted credits re-filtered against the
   wrong tombstone list - so the vault was correcting the record instead of being
   it. Now: browser cache, then folder, then the seeding and filtering run on
   whatever won. */
seed();render();loadArts().then(()=>loadMeta()).then(async()=>{ if(!HUB_DEMO&&isDemo()) await dropDemoData(); }).then(()=>vaultAuto()).then(()=>{const n=credits.length;credits=credits.filter(c=>!isTombed(c.title));if(credits.length!==n)saveCredits();}).then(()=>seedAuditions()).then(()=>fromInbox()).then(()=>fromYou()).then(()=>{ try{ if(window.WorkedWith) WorkedWith.fromCredits(credits.filter(c=>c.kind!=='removed')); }catch(e){} }).then(()=>tapesToVault()).then(()=>fromTakes()).then(render);
</script><script src="../shared/view.js"></script>
