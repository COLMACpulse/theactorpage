<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="../shared/hot.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BACKLOT · The ground you have</title>
<meta name="description" content="The ground you already have: every spot you can shoot and what is on hand, your scripts against it, and a start dealt from it.">
<meta name="theme-color" content="#121110">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BACKLOT">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:Jost;font-weight:400;font-display:swap;src:url(fonts/jost-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Jost;font-weight:500;font-display:swap;src:url(fonts/jost-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:Jost;font-weight:600;font-display:swap;src:url(fonts/jost-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Courier Prime';font-weight:400;font-display:swap;src:url(fonts/courier-prime-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Courier Prime';font-weight:700;font-display:swap;src:url(fonts/courier-prime-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#121110; --panel:#1b1916; --panel2:#24211d; --ink:#ece7dc; --dim:#a39c8e; --faint:#6e675c; --line:#2f2b26;
  --tung:#e0a23c; --tung-ink:#1a1206; --tung-soft:rgba(224,162,60,.14); --tung-text:#e9b25a;
  --bad:#e0785f; --good:#8fbf8a; --blue:#7fa6d6;
  --sans:Jost,system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"Courier Prime","Courier New",Courier,monospace;
  --r:12px; --tap:44px; --nav:64px; color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#ece7dc; --panel:#f6f2ea; --panel2:#e3dccd; --ink:#1d1a15; --dim:#5f584b; --faint:#8a8273; --line:#d3cab8;
  --tung-soft:rgba(224,162,60,.22); --tung-text:#8a5a08; --bad:#a8432c; --good:#3d7a3a; --blue:#2f5f99; color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#ece7dc; --panel:#f6f2ea; --panel2:#e3dccd; --ink:#1d1a15; --dim:#5f584b; --faint:#8a8273; --line:#d3cab8;
  --tung-soft:rgba(224,162,60,.22); --tung-text:#8a5a08; --bad:#a8432c; --good:#3d7a3a; --blue:#2f5f99; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-weight:600;letter-spacing:.02em;margin:0}
.dim{color:var(--dim)} .faint{color:var(--faint)} .hide{display:none!important}
.btn{min-height:var(--tap);padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:500;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--tung);color:var(--tung-ink);border-color:var(--tung)}
.btn.ghost{background:transparent} .btn.block{width:100%} .btn.sm{padding:0 12px;font-size:14px}
.btn.big{min-height:60px;font-size:17px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{min-height:var(--tap);padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--dim)}
.chip.on{background:var(--tung);color:var(--tung-ink);border-color:var(--tung)}
.chip i{font-style:normal;font-size:12px;opacity:.75}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:0 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.msg{padding:12px 14px;border-radius:10px;background:var(--panel2);border-left:3px solid var(--tung);margin:12px 0;font-size:14px}
.msg.bad{border-left-color:var(--bad)}
.field{width:100%;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:10px 12px;font-size:16px;min-height:var(--tap)}
textarea.field{min-height:120px;resize:vertical;font-size:15px}
select.field{appearance:auto}

.shell{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.top{position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .k{font-size:11px;letter-spacing:.22em;color:var(--faint)}
.top b{display:block;font-size:16px;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .count{font-size:13px;color:var(--tung-text);margin-top:1px}
main{flex:1;min-width:0;padding:16px 16px calc(var(--nav) + 24px + env(safe-area-inset-bottom));max-width:720px;width:100%;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{min-height:var(--nav);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;letter-spacing:.12em;color:var(--faint)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--tung-text)}


/* backlot */
.lab{display:block;font-size:13px;color:var(--dim);margin:12px 0 6px}
.small{font-size:13.5px}
.chip.sm{min-height:38px;padding:0 12px}
.chip .lnk{padding:0 0 0 4px;color:inherit;opacity:.7}
.lnk{background:none;border:0;color:var(--tung-text);padding:6px 4px;font-size:13.5px;text-decoration:none}.lnk.faint{color:var(--faint)}
a.btn{text-decoration:none;color:inherit}
.stg{display:inline-block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--tung-text);margin-top:4px}.stg.bad{color:var(--bad)}
.seg{display:flex;gap:6px;margin:0 0 12px}
.mapw{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel2)}
#map{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
#map.drag{cursor:grabbing}
.mg{stroke:var(--line);stroke-width:1}.ml{stroke:var(--tung);stroke-width:1.2;stroke-dasharray:4 4;opacity:.8}
.mp{cursor:pointer}.mp .hit{fill:transparent}.mp circle:not(.hit){fill:var(--tung);stroke:var(--tung-ink);stroke-width:1.5}.mp.on circle:not(.hit){fill:var(--bad)}
.mp text{font-family:var(--sans);font-weight:600;fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--panel2);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.mn path{fill:var(--ink)}.mn text{font:600 12px var(--sans);fill:var(--ink);text-anchor:middle}
.ms path{fill:none;stroke:var(--ink);stroke-width:1.5}.ms text{font-family:var(--mono);fill:var(--ink);text-anchor:middle}
.mz{position:absolute;left:8px;top:8px;display:flex;gap:6px}.mz .btn{min-height:40px;min-width:40px;padding:0 10px;background:var(--panel)}
.mph{display:block;width:100%;max-height:200px;object-fit:cover;border-radius:8px;margin:10px 0}
.sc{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;margin:0 0 10px;color:inherit}
.sc .th{width:72px;height:54px;border-radius:8px;background:var(--panel2);overflow:hidden;display:flex;align-items:center;justify-content:center}
.sc .th img{width:100%;height:100%;object-fit:cover}.sc .th svg{width:26px;height:26px;fill:none;stroke:var(--faint);stroke-width:1.5}
.sc b{display:block;font-size:16px}.sc small{display:block;color:var(--dim);font-size:13px;margin-top:2px}
.photos{display:flex;gap:8px;overflow-x:auto;margin:0 0 6px;padding-bottom:4px}
.ph{position:relative;flex:0 0 auto;width:132px;height:99px;border-radius:8px;overflow:hidden;background:var(--panel2)}.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .lnk{position:absolute;top:2px;right:2px;background:color-mix(in srgb,var(--bg) 70%,transparent);border-radius:6px;padding:2px 7px}
.ph.add{display:flex;align-items:center;justify-content:center;border:1px dashed var(--line);cursor:pointer;color:var(--tung-text);font-size:13px;letter-spacing:.1em}
.dc{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px;color:inherit}
.dc b{display:block;font-size:16px}.dc small{display:block;color:var(--dim);font-size:13px;margin-top:2px}
.bar{display:block;height:4px;border-radius:2px;background:var(--panel2);margin:0 0 8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--tung)}
.facts{margin:0;padding-left:18px}.facts li{margin:5px 0;font-size:15px}
.sr{display:grid;grid-template-columns:28px 1fr;gap:8px;border-top:1px solid var(--line);padding:8px 0}.sr:first-child{border-top:0}.sr>b{color:var(--faint);font:13px var(--mono)}
.sr .hd{font:14px var(--mono)}.sr small{display:block;font-size:13px}.sr .ok{color:var(--good)}.sr .fl{color:var(--tung-text)}
.deal .dl{font-size:17px;margin:0 0 10px}
.hds{font:14px/1.6 var(--mono);background:var(--panel2);border-radius:8px;padding:10px 12px;margin:0 0 8px;white-space:pre-wrap}
.li{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding:8px 0;font-size:14.5px}.li:first-child{border-top:0}
.li img,.li .nop{flex:0 0 auto;width:48px;height:36px;border-radius:6px;object-fit:cover;background:var(--panel2)}
.bad{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:var(--panel2);border:1px solid var(--tung);color:var(--ink);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:40;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
body:has(#hotbar) .top{padding-top:calc(env(safe-area-inset-top) + 50px)}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="k">BACKLOT</div>
    <b id="title">The ground you have</b>
    <div class="count" id="count"></div>
  </header>
  <main id="main"></main>
</div>
<nav class="tabs" id="tabs">
  <button data-t="spots"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span>SPOTS</span></button>
  <button data-t="drawer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M3 12h18M10 8h4M10 16h4"/></svg><span>DRAWER</span></button>
  <button data-t="ground"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="11" height="15" rx="1.5" transform="rotate(-8 9.5 10.5)"/><rect x="9" y="6" width="11" height="15" rx="1.5" transform="rotate(8 14.5 13.5)"/></svg><span>DEAL</span></button>
  <button data-t="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg><span>LIST</span></button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="../actor-os/sides.js"></script>
<script src="../film/film.js"></script>
<script src="../shared/backlot.js"></script>
<script src="../shared/kit.js"></script>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
<script src="../shared/view.js"></script>
</body>
</html>
