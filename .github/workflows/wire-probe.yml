name: wire-probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the candidate sources and their robots rules, raw
        run: |
          mkdir out; UA='theactorpage-wire/0.1 (+https://colmacpulse.github.io/theactorpage/privacy/)'
          while read n u; do curl -sS -A "$UA" -L --max-redirs 3 --max-time 30 -o "out/$n" -w "$n %{http_code} %{content_type} %{size_download} %{url_effective}\n" "$u" >> out/_status.txt || echo "$n FAILED" >> out/_status.txt; done <<'L'
          cfc.html https://film.ca.gov/film-and-television-tax-credit-program-approved-projects-list/
          cfc_robots.txt https://film.ca.gov/robots.txt
          deadline.xml https://deadline.com/feed/
          deadline_robots.txt https://deadline.com/robots.txt
          variety.xml https://variety.com/feed/
          variety_robots.txt https://variety.com/robots.txt
          thr.xml https://www.hollywoodreporter.com/feed/
          thr_robots.txt https://www.hollywoodreporter.com/robots.txt
          L
          cat out/_status.txt
      - name: Keep a short look on a temporary branch (feeds cut to their first 4 KB)
        run: |
          for f in deadline.xml variety.xml thr.xml; do head -c 4000 out/$f > out/$f.head && rm out/$f; done
          cd out && git init -q && git checkout -q -b wire-probe && git add -A && git -c user.name=wire -c user.email=noreply@github.com commit -q -m probe
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" wire-probe
