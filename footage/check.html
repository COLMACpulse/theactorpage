<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="../shared/tour.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CHECK THE COPY · THEACTORPAGE</title>
<meta name="description" content="Before you erase a camera card: every file on your copies checked against the card, byte for byte. Read on your device; nothing uploaded, nothing erased.">
<meta name="theme-color" content="#0d0f12">
<link rel="icon" href="../img/sigil-film-64.png">
<style>
@font-face{font-family:Jost;font-weight:400;font-display:swap;src:url(../fonts/jost-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Jost;font-weight:500;font-display:swap;src:url(../fonts/jost-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Courier Prime';font-weight:700;font-display:swap;src:url(../fonts/courier-prime-latin-700-normal.woff2) format('woff2')}
:root{--bg:#0d0f12;--p1:#14171b;--p2:#1b1f25;--ink:#ece7dc;--dim:#c3c8d0;--mut:#9aa1ab;--line:#272d36;--gold:#e0a23c;--gold-ink:#17110a;--bad:#e0785f;--good:#8fbf8a;
 --sans:Jost,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Courier Prime",ui-monospace,monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
a{color:var(--gold)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{max-width:760px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px 80px}
.crumb{font:700 11px var(--mono);letter-spacing:.2em;color:var(--mut);margin:0 0 6px}.crumb a{color:var(--gold);text-decoration:none}
h1{font-weight:500;font-size:clamp(1.8rem,6vw,2.4rem);letter-spacing:.08em;margin:0}
.sub{color:var(--dim);margin:4px 0 16px}
.tabs{display:flex;gap:8px;margin:0 0 18px}
.tabs button{flex:1;min-height:46px;border:1px solid var(--line);background:none;border-radius:10px;font:700 12px var(--mono);letter-spacing:.18em;cursor:pointer}
.tabs button.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.card{background:var(--p1);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 12px}
.kick{font:700 11px var(--mono);letter-spacing:.2em;color:var(--gold);margin:0 0 6px}
.dim{color:var(--dim)}.mut{color:var(--mut)}.small{font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.field{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-height:44px}
label.lab{display:block;font:700 11px var(--mono);letter-spacing:.16em;color:var(--mut);margin:10px 0 4px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}
.btn{min-height:44px;padding:10px 14px;border-radius:9px;border:1px solid var(--gold);background:var(--gold);color:var(--gold-ink);font:700 12px var(--mono);letter-spacing:.14em;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btn.ghost{background:none;color:var(--gold)}
.btn.quiet{background:none;color:var(--dim);border-color:var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.chip{min-height:38px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:none;font:700 11px var(--mono);letter-spacing:.12em;cursor:pointer}
.chip.on{border-color:var(--gold);color:var(--gold)}
.person{display:block;width:100%;text-align:left;background:var(--p1);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 8px;cursor:pointer}
.person b{font-weight:500;font-size:1.05rem}.person .rl{font:700 10.5px var(--mono);letter-spacing:.16em;color:var(--gold);margin-left:8px}
.person .from{display:block;color:var(--mut);font-size:13.5px;margin-top:3px}
.person .tag{float:right;font:700 10px var(--mono);letter-spacing:.14em;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.person.dnc{opacity:.6}
.due{border-color:var(--gold)}
.steps{display:flex;flex-wrap:wrap;gap:6px}
.msg{color:var(--gold);font-size:14px;margin:8px 0}
.warn{border-left:3px solid var(--gold);padding:8px 12px;color:var(--dim);font-size:14px;margin:10px 0}
ul.where{margin:6px 0 0;padding-left:18px}ul.where li{margin:4px 0}
.empty{color:var(--mut);padding:10px 2px}
.vid{width:100%;max-height:60vh;background:#000;border-radius:10px;display:block}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0}.prog i{display:block;height:100%;background:var(--gold);width:0}
.st{font:700 10.5px var(--mono);letter-spacing:.14em;color:var(--gold)}
ol.how{margin:6px 0 0;padding-left:20px}ol.how li{margin:5px 0}
/* CHECK THE COPY */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.btn[disabled]{opacity:.45;cursor:default}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:0 0 12px}
.slot{background:var(--p1);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.slot.open{border-style:dashed}
.slot b{font-weight:500;font-size:1.1rem;word-break:break-all}
.pick{position:relative;overflow:hidden}.pick input{position:absolute;inset:0;opacity:0;cursor:pointer}
.files{display:flex;flex-direction:column;margin:10px 0}
.frow{display:grid;grid-template-columns:minmax(0,1fr) 84px repeat(var(--n),minmax(96px,150px));gap:10px;align-items:center;min-height:40px;border-top:1px solid var(--line);font:400 13px var(--mono)}
.frow span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow.hd{border-top:0;min-height:28px;font:700 10.5px var(--mono);letter-spacing:.14em;color:var(--mut)}
.ok{color:var(--good)}.no{color:#f0a58f}.on{color:var(--gold)}
.verdict{border-radius:12px;padding:16px 18px;margin:0 0 12px}
.verdict.safe{background:#13201a;border:1px solid #2f5a44}.verdict.safe b{color:#a9d6a4}
.verdict.stop{background:#2a1712;border:1px solid #6a3a2c}.verdict.stop b{color:#f4b9a6}
.verdict b{display:block;font-size:1.4rem;font-weight:500}
.hist{list-style:none;margin:6px 0;padding:0}.hist li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.promise{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:22px;border-top:1px solid var(--line);padding-top:14px}
.promise b{display:block;font:700 10.5px var(--mono);letter-spacing:.16em;color:var(--mut)}
@media(max-width:560px){.frow{grid-template-columns:minmax(0,1fr) repeat(var(--n),76px)}.frow .sz{display:none}}
</style>
</head>
<body>
<main>
  <p class="crumb"><a href="../">THEACTORPAGE</a> · <a href="./">FOOTAGE</a></p>
  <h1>CHECK THE COPY</h1>
  <p class="sub">Before you erase a camera card: every file on your copies has to match the card exactly. A file count isn't a check.</p>
  <div id="view"></div>
</main>
<script src="../shared/copycheck.js"></script>
<script src="check.js"></script>
<script>if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
</body>
</html>
