<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PAPER TRAIL · Every draft, never overwritten</title>
<meta name="description" content="Every draft you have, kept and never overwritten. Projects, drafts, scenes and characters, with what each scene has on file and what it's missing.">
<meta name="theme-color" content="#F2ECDE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PAPER TRAIL">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --paper:#F2ECDE; --paper-2:#E7DFCC; --paper-3:#DCD2BA;
  --ink:#171310; --ink-2:#574E3E; --ink-3:#877C66;
  --gold:#9A7614; --gold-hi:#C9A227; --gold-wash:rgba(201,162,39,.16);
  --grease:#B23A2F; --ok:#3D6B3A; --rule:#C6BAA0; --rule-hard:#8E8168;
  --display:"Haettenschweiler","Arial Narrow","Helvetica Neue Condensed","Liberation Sans Narrow",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --code:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
body{background-image:radial-gradient(140% 60% at 50% -10%, rgba(201,162,39,.13), transparent 60%);min-height:100vh}
a{color:var(--gold)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.hide{display:none!important}
header{padding:18px 28px;border-bottom:2px solid var(--ink);position:sticky;top:0;z-index:5;background:rgba(242,236,222,.96);backdrop-filter:blur(6px)}
.crumb{font-family:var(--code);font-size:10px;letter-spacing:.20em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.crumb a{color:var(--gold);text-decoration:none;cursor:pointer}
h1{font-family:var(--display);font-size:clamp(26px,3.4vw,40px);letter-spacing:.09em;text-transform:uppercase;margin:0;line-height:1}
h1 b{color:var(--gold);font-weight:inherit}
.sub{font-family:var(--code);font-size:11px;letter-spacing:.13em;color:var(--ink-2);text-transform:uppercase;margin-top:6px}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
nav.tabs button{font-family:var(--code);font-size:11px;letter-spacing:.16em;text-transform:uppercase;border:1px solid var(--rule-hard);background:transparent;padding:8px 12px;min-height:38px}
nav.tabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
main{max-width:1400px;margin:auto;padding:22px 28px 90px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));border:1px solid var(--rule-hard);background:var(--paper-2);margin-bottom:18px}
.stats div{padding:12px 16px;border-right:1px solid var(--rule)}
.stats b{display:block;font-family:var(--display);font-size:30px;line-height:1}
.stats span{font-family:var(--code);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.frame{position:relative;border:1px solid var(--rule-hard);background:var(--paper-2);text-align:left;padding:0;width:100%;transition:transform .12s}
.frame:hover{transform:translateY(-2px);border-color:var(--ink)}
.perf{display:flex;gap:5px;padding:6px 9px;border-bottom:1px solid var(--rule);background:var(--paper-3)}
.perf i{width:10px;height:7px;border:1px solid var(--rule-hard);border-radius:1.5px;background:var(--paper);display:block}
.fb{padding:12px 16px 16px}
.fk{font-family:var(--code);font-size:10px;letter-spacing:.18em;color:var(--ink-3);text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.ft{font-family:var(--display);font-size:22px;letter-spacing:.05em;text-transform:uppercase;line-height:1.05;margin:6px 0 8px}
.fl{font-size:13px;color:var(--ink-2)}
.miss{font-size:13px;color:var(--grease);margin-top:8px}
.have{font-size:13px;color:var(--ok);margin-top:8px}
.eyebrow{font-family:var(--code);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin:22px 0 8px}
.panel{border:1px solid var(--rule-hard);background:var(--paper-2);padding:16px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font-family:var(--code);font-size:11px;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--ink);background:var(--paper);padding:9px 14px;min-height:40px}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn.ghost{border-color:var(--rule-hard);background:transparent}
.btn.sm{padding:6px 10px;min-height:34px;font-size:10px}
.field{width:100%;border:1px solid var(--rule-hard);background:var(--paper);padding:9px 11px;min-height:40px}
textarea.field{min-height:90px;resize:vertical}
.drop{border:2px dashed var(--rule-hard);padding:26px;text-align:center;background:var(--paper);cursor:pointer}
.drop.over{border-color:var(--gold);background:var(--gold-wash)}
.drop b{font-family:var(--display);font-size:24px;letter-spacing:.08em;display:block}
.list{border-top:1px solid var(--rule)}
.li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.li .w{min-width:0;flex:1 1 260px}
.li small a,.li a[data-goscene]{color:var(--gold);cursor:pointer;text-decoration:underline}
.li small{display:block;color:var(--ink-3);font-size:12px}
.tag{font-family:var(--code);font-size:10px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--rule-hard);padding:2px 7px;white-space:nowrap;display:inline-block}
.tag.cur{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tag.red{color:var(--grease);border-color:var(--grease)}
.tag.ok{color:var(--ok);border-color:var(--ok)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--rule-hard);background:var(--paper);padding:3px 9px;font-size:13px}
.hm{display:grid;grid-template-columns:22px 1fr;gap:4px 8px;font-size:14px}
.hm i{font-style:normal;font-weight:700}
.hm .y{color:var(--ok)} .hm .n{color:var(--grease)}
.hm small{color:var(--ink-3)}
.read{font:13px/1.55 var(--code);white-space:pre-wrap;color:var(--ink-2);max-height:420px;overflow:auto;background:var(--paper);border:1px solid var(--rule);padding:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--rule)}
th{font-family:var(--code);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.tbl{overflow-x:auto}
.msg{border-left:3px solid var(--gold);background:var(--paper-2);padding:10px 12px;margin:10px 0;font-size:14px}
.msg.bad{border-left-color:var(--grease)}
.note{font-size:13px;color:var(--ink-3)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--paper);padding:10px 16px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:50;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.ln{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.ln .lt{flex:1 1 300px;font:14px/1.5 var(--code);white-space:pre-wrap}
.mks{display:flex;gap:4px}
.mk{font-family:var(--code);font-size:10px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--rule-hard);background:var(--paper);padding:5px 8px;min-height:34px}
.mk.landed.on{background:var(--ok);color:var(--paper);border-color:var(--ok)}
.mk.lost.on{background:var(--grease);color:var(--paper);border-color:var(--grease)}
.mk.confused.on{background:var(--gold);color:var(--paper);border-color:var(--gold)}
.rev{max-height:none}
.rl{display:grid;grid-template-columns:18px 1fr;gap:4px}
.rl .rmk{color:var(--gold);font-weight:700}
.rl.new{color:var(--ink)}
.rl.cut{color:var(--ink-3);text-decoration:line-through}
.rimg{width:100%;max-height:320px;object-fit:contain;background:var(--paper-3);display:block}
.rcard audio{width:100%}
.rthumbs{display:flex;gap:8px;flex-wrap:wrap}
.rthumb{width:96px;height:72px;object-fit:cover;border:1px solid var(--rule-hard);cursor:pointer;background:var(--paper-3)}
.tboard{position:relative;width:100%;aspect-ratio:10/7;background:var(--paper);border:1px solid var(--rule-hard);overflow:hidden;background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);background-size:10% 14.2857%}
.tlines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tl{stroke:var(--gold);stroke-width:3;vector-effect:non-scaling-stroke}
.tl.unknown{stroke:var(--ink-3);stroke-dasharray:6 5}.tl.opposite{stroke:var(--grease)}.tl.same{stroke:var(--ok)}
.tlab{position:absolute;transform:translate(-50%,-50%);font:10px var(--code);letter-spacing:.1em;text-transform:uppercase;background:var(--paper);border:1px solid var(--rule-hard);padding:1px 5px;pointer-events:none;z-index:3}
.titem{position:absolute;background:var(--paper-2);border:1px solid var(--rule-hard);box-shadow:0 2px 6px rgba(0,0,0,.18);touch-action:none;cursor:grab;user-select:none;z-index:2}
.titem.sel{outline:2px solid var(--ink)}.titem.linka{outline:3px solid var(--gold)}
.titem img,.titem video{display:block;width:100%;pointer-events:none}
.titem audio{width:100%;height:30px}
.tnote{padding:8px;font-size:13px;line-height:1.35;max-height:180px;overflow:hidden}
.tcap{font-size:11px;padding:3px 6px;color:var(--ink-2)}
.tnum{position:absolute;top:-9px;left:-9px;background:var(--ink);color:var(--paper);font:700 11px var(--code);width:20px;height:20px;border-radius:10px;display:grid;place-items:center}
.tsize{position:absolute;right:-7px;bottom:-7px;width:16px;height:16px;background:var(--gold);border-radius:3px;cursor:nwse-resize}
.tempty{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-3);font-size:14px;text-align:center;padding:20px}
.tshelf{display:flex;gap:8px;flex-wrap:wrap}
.tput{display:flex;gap:8px;align-items:center;border:1px solid var(--rule-hard);background:var(--paper);padding:6px 8px;min-height:44px;max-width:280px;text-align:left;font-size:13px}
.tput img{width:44px;height:34px;object-fit:cover}
@media (max-width:600px){ header{padding:14px 16px} main{padding:16px 16px 80px} .grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<header>
  <div class="crumb" id="crumb"><a data-go="projects">Paper Trail</a></div>
  <h1>PAPER <b>TRAIL</b></h1>
  <div class="sub">WRITE · every draft, never overwritten · it reads, you decide</div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="main"></main>
<div class="toast" id="toast"></div>
<input type="file" id="file" multiple accept=".pdf,.fdx,.fountain,.txt,.md,.docx,text/plain,application/pdf" class="hide">
<input type="file" id="imp" accept=".json,application/json" class="hide">
<script src="../shared/shelf.js"></script>
<script src="../actor-os/sides.js"></script>
<script src="../actor-os/pdf.js"></script>
<script src="../film/film.js"></script>
<script src="../shared/inbox.js"></script>
<script src="../shared/xlsx.js"></script>
<script src="trail.js"></script>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
</body>
</html>
