<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="../shared/tour.js"></script>
<script src="../shared/hot.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SET LIST · Funny, in order</title>
<meta name="description" content="Your funny material: clip, joke, bit, act. Put it in a set, in order, with its running time. Record a 30-second take.">
<meta name="theme-color" content="#121110">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SET LIST">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:Jost;font-weight:400;font-display:swap;src:url(fonts/jost-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Jost;font-weight:500;font-display:swap;src:url(fonts/jost-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:Jost;font-weight:600;font-display:swap;src:url(fonts/jost-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Courier Prime';font-weight:400;font-display:swap;src:url(fonts/courier-prime-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Courier Prime';font-weight:700;font-display:swap;src:url(fonts/courier-prime-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#121110; --panel:#1b1916; --panel2:#24211d; --ink:#ece7dc; --dim:#a39c8e; --faint:#6e675c; --line:#2f2b26;
  --tung:#e0a23c; --tung-ink:#1a1206; --tung-soft:rgba(224,162,60,.14); --tung-text:#e9b25a;
  --bad:#e0785f; --good:#8fbf8a; --blue:#7fa6d6;
  --sans:Jost,system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"Courier Prime","Courier New",Courier,monospace;
  --r:12px; --tap:44px; --nav:64px; color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#ece7dc; --panel:#f6f2ea; --panel2:#e3dccd; --ink:#1d1a15; --dim:#5f584b; --faint:#8a8273; --line:#d3cab8;
  --tung-soft:rgba(224,162,60,.22); --tung-text:#8a5a08; --bad:#a8432c; --good:#3d7a3a; --blue:#2f5f99; color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#ece7dc; --panel:#f6f2ea; --panel2:#e3dccd; --ink:#1d1a15; --dim:#5f584b; --faint:#8a8273; --line:#d3cab8;
  --tung-soft:rgba(224,162,60,.22); --tung-text:#8a5a08; --bad:#a8432c; --good:#3d7a3a; --blue:#2f5f99; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-weight:600;letter-spacing:.02em;margin:0}
.dim{color:var(--dim)} .faint{color:var(--faint)} .hide{display:none!important}
.btn{min-height:var(--tap);padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:500;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--tung);color:var(--tung-ink);border-color:var(--tung)}
.btn.ghost{background:transparent} .btn.block{width:100%} .btn.sm{padding:0 12px;font-size:14px}
.btn.big{min-height:60px;font-size:17px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{min-height:var(--tap);padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--dim)}
.chip.on{background:var(--tung);color:var(--tung-ink);border-color:var(--tung)}
.chip i{font-style:normal;font-size:12px;opacity:.75}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:0 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.msg{padding:12px 14px;border-radius:10px;background:var(--panel2);border-left:3px solid var(--tung);margin:12px 0;font-size:14px}
.msg.bad{border-left-color:var(--bad)}
.field{width:100%;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:10px 12px;font-size:16px;min-height:var(--tap)}
textarea.field{min-height:120px;resize:vertical;font-size:15px}
select.field{appearance:auto}

.shell{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.top{position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .k{font-size:11px;letter-spacing:.22em;color:var(--faint)}
.top b{display:block;font-size:16px;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .count{font-size:13px;color:var(--tung-text);margin-top:1px}
main{flex:1;min-width:0;padding:16px 16px calc(var(--nav) + 24px + env(safe-area-inset-bottom));max-width:720px;width:100%;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(3,1fr);background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{min-height:var(--nav);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;letter-spacing:.12em;color:var(--faint)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--tung-text)}

/* set list */
.lab{display:block;font-size:13px;color:var(--dim);margin:0 0 4px}
.pc{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.pc b{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:2px 9px;white-space:nowrap;color:var(--dim)}
.back{background:none;border:0;color:var(--tung-text);font-size:15px;padding:4px 0 12px}
.it{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.it .n{width:24px;flex:none;font:700 14px var(--mono);color:var(--faint)}
.it .w{flex:1;min-width:0}.it .w b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.it .w small{color:var(--faint);font-size:12.5px}
.ib{width:40px;height:40px;flex:none;border-radius:8px;border:1px solid var(--line);background:transparent;font-size:16px}
.chip.sm{min-height:36px;padding:0 12px}
.runtime{margin-top:12px;font:700 20px var(--mono);color:var(--tung-text)}
.vid{width:100%;max-height:60vh;border-radius:10px;background:#000;display:block}
.vid.mirror{transform:scaleX(-1)}
.ov{position:fixed;inset:0;z-index:60;background:var(--bg);padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);overflow:auto}
.recbox{max-width:640px;margin:0 auto}.recbox .aud{border:1px solid var(--line);padding:40px 0;text-align:center;font-weight:700;letter-spacing:.2em}.slkit{margin:0 0 14px}
.cnt{font:700 34px var(--mono);text-align:center;margin:10px 0 0;color:var(--tung-text)}
.stagetext{white-space:pre-wrap;font:700 30px/1.5 var(--mono);letter-spacing:.04em;margin:0 0 16px}
body.ovopen{overflow:hidden}
.prompt{font-size:19px;line-height:1.4;margin:0 0 12px}
.cues{margin:0 0 12px;padding-left:20px;font-size:17px}
.from{border-color:var(--tung)}
.bad{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:var(--panel2);border:1px solid var(--tung);color:var(--ink);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:70;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* the paper bag man: on the left on a computer, up top on a phone */
.side{display:none}
.hero{margin:0 0 18px}
.hero .banner{margin:-16px -16px 0;height:min(78vw,340px);position:relative;overflow:hidden;background:#1a1a1a}
.hero .banner img{width:100%;height:100%;object-fit:cover;object-position:35% 18%;display:block}
.hero .banner::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,17,16,0) 55%,var(--bg) 100%)}
.hero .copy{position:relative;margin-top:-28px}
.hero .hk{font-size:12px;letter-spacing:.16em;color:var(--tung-text);font-weight:600}
.hero h1{font-size:clamp(38px,6vw,60px);line-height:.98;letter-spacing:-.02em;margin:6px 0 0}
.hero .tag{font-size:clamp(18px,2.4vw,24px);font-weight:600;line-height:1.2;margin:8px 0 0}
.hero .say{color:var(--dim);font-size:15.5px;line-height:1.5;margin:10px 0 0;max-width:46ch}
.hero .go{min-height:64px;font-size:17px;font-weight:600;letter-spacing:.06em;width:100%;margin-top:14px;flex-direction:column;gap:0}
.hero .go small{font-weight:400;font-size:12.5px;letter-spacing:0;opacity:.8}
.hero .alt{margin-top:8px}
.hero .notes{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.hero .notes span{font-size:11.5px;letter-spacing:.14em;padding:5px 11px;border:1px solid var(--line);border-radius:999px;color:var(--dim)}
@media (min-width:900px){
 .side{display:block;position:fixed;left:0;top:0;bottom:0;width:min(42vw,580px);background:#1a1a1a;z-index:5}
 .side img{width:100%;height:100%;object-fit:cover;object-position:28% 0;display:block}
 .side::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(18,17,16,0) 62%,var(--bg) 100%)}
 .shell{margin-left:min(42vw,580px)}
 nav.tabs{left:min(42vw,580px)}
 .hero .banner{display:none}.hero .copy{margin-top:8px}
 .hero .go{width:auto;padding:0 28px;align-items:flex-start}
 .toast{left:calc(50% + min(21vw,290px))}
}
</style>
</head>
<body>
<div class="side" aria-hidden="true"><img src="img/paperbag.jpg" alt="" width="720" height="801"></div>
<div class="shell">
  <header class="top">
    <div class="k">SET LIST</div>
    <b id="title">Funny, in order</b>
    <div class="count" id="count"></div>
  </header>
  <main id="main"></main>
</div>
<nav class="tabs" id="tabs">
  <button data-t="material"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg><span>MATERIAL</span></button>
  <button data-t="sets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h1M4 12h1M4 18h1"/></svg><span>SETS</span></button>
  <button data-t="prompts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 1 3.5 10.9V17h-7v-3.1A6 6 0 0 1 12 3z"/><path d="M9.5 20.5h5"/></svg><span>PROMPTS</span></button>
</nav>
<div class="ov" id="recov" hidden></div>
<div class="ov" id="stageov" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="../shared/capture.js"></script>
<script src="../shared/kit.js"></script>
<script src="set.js"></script>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
<script src="../shared/view.js"></script>
</body>
</html>
