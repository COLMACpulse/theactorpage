<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="../shared/hot.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STORY STUDIO · Make it alone</title>
<meta name="description" content="One person makes the whole scene: you play the parts, the others become a shoulder, hands, a voice, shot on what you own.">
<meta name="theme-color" content="#121110">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="STORY STUDIO">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:Jost;font-weight:400;font-display:swap;src:url(fonts/jost-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Jost;font-weight:500;font-display:swap;src:url(fonts/jost-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:Jost;font-weight:600;font-display:swap;src:url(fonts/jost-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Courier Prime';font-weight:400;font-display:swap;src:url(fonts/courier-prime-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Courier Prime';font-weight:700;font-display:swap;src:url(fonts/courier-prime-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#121110; --panel:#1b1916; --panel2:#24211d; --ink:#ece7dc; --dim:#a39c8e; --faint:#6e675c; --line:#2f2b26;
  --tung:#e0a23c; --tung-ink:#1a1206; --tung-soft:rgba(224,162,60,.14); --tung-text:#e9b25a;
  --bad:#e0785f; --good:#8fbf8a; --blue:#7fa6d6;
  --sans:Jost,system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"Courier Prime","Courier New",Courier,monospace;
  --r:12px; --tap:44px; --nav:64px; color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#ece7dc; --panel:#f6f2ea; --panel2:#e3dccd; --ink:#1d1a15; --dim:#5f584b; --faint:#8a8273; --line:#d3cab8;
  --tung-soft:rgba(224,162,60,.22); --tung-text:#8a5a08; --bad:#a8432c; --good:#3d7a3a; --blue:#2f5f99; color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#ece7dc; --panel:#f6f2ea; --panel2:#e3dccd; --ink:#1d1a15; --dim:#5f584b; --faint:#8a8273; --line:#d3cab8;
  --tung-soft:rgba(224,162,60,.22); --tung-text:#8a5a08; --bad:#a8432c; --good:#3d7a3a; --blue:#2f5f99; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-weight:600;letter-spacing:.02em;margin:0}
.dim{color:var(--dim)} .faint{color:var(--faint)} .hide{display:none!important}
.btn{min-height:var(--tap);padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:500;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--tung);color:var(--tung-ink);border-color:var(--tung)}
.btn.ghost{background:transparent} .btn.block{width:100%} .btn.sm{padding:0 12px;font-size:14px}
.btn.big{min-height:60px;font-size:17px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{min-height:var(--tap);padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--dim)}
.chip.on{background:var(--tung);color:var(--tung-ink);border-color:var(--tung)}
.chip i{font-style:normal;font-size:12px;opacity:.75}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:0 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.msg{padding:12px 14px;border-radius:10px;background:var(--panel2);border-left:3px solid var(--tung);margin:12px 0;font-size:14px}
.msg.bad{border-left-color:var(--bad)}
.field{width:100%;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:10px 12px;font-size:16px;min-height:var(--tap)}
textarea.field{min-height:120px;resize:vertical;font-size:15px}
select.field{appearance:auto}

.shell{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.top{position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .k{font-size:11px;letter-spacing:.22em;color:var(--faint)}
.top b{display:block;font-size:16px;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .count{font-size:13px;color:var(--tung-text);margin-top:1px}
main{flex:1;min-width:0;padding:16px 16px calc(var(--nav) + 24px + env(safe-area-inset-bottom));max-width:720px;width:100%;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{min-height:var(--nav);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;letter-spacing:.12em;color:var(--faint)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--tung-text)}


.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:var(--panel2);border:1px solid var(--tung);color:var(--ink);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:50;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* film */
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;min-height:130px;border:2px dashed var(--faint);border-radius:16px;padding:20px;margin:8px 0 12px}
.drop.over{border-color:var(--tung);background:var(--tung-soft)}
.drop b{font-size:18px;letter-spacing:.06em}
.scriptrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.scriptrow div{min-width:0}.scriptrow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scriptrow small{color:var(--faint)}
.sc{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.sc .hd{font:700 14px/1.35 var(--mono);letter-spacing:.04em}
.sc .sub{font-size:13px;color:var(--dim);margin-top:4px}
.sc .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--dim);white-space:nowrap}
.tag.on{color:var(--tung-text);border-color:var(--tung)} .tag.done{color:var(--good);border-color:var(--good)} .tag.warn{color:var(--bad);border-color:var(--bad)}
.ways{display:grid;gap:8px;margin:6px 0 4px}
.way{text-align:left;border:1px solid var(--line);background:transparent;border-radius:10px;padding:10px 12px;min-height:var(--tap)}
.way b{display:block;font-size:15px} .way span{font-size:13px;color:var(--dim)}
.way.on{border-color:var(--tung);background:var(--tung-soft)}
.shot{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.shot input{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--tung)}
.shot b{display:block;font-size:15px;font-weight:500} .shot small{display:block;color:var(--dim);font-size:13px}
.shot.done b{color:var(--faint);text-decoration:line-through}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips .chip{min-height:34px;padding:0 12px}
.cont{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.cont h3{font-size:13px;letter-spacing:.14em;margin-bottom:8px}
.cont .g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cont label{font-size:11px;letter-spacing:.12em;color:var(--faint);text-transform:uppercase;display:block}
.cont .field{min-height:40px;padding:8px 10px;font-size:15px}
.read{font:14px/1.5 var(--mono);white-space:pre-wrap;color:var(--dim)}
.read .who{color:var(--ink);font-weight:700}
.own{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.own div{min-width:0} .own small{display:block;color:var(--faint);font-size:13px}
.x{min-width:var(--tap);min-height:var(--tap);border:0;background:none;color:var(--faint);font-size:20px}
.credpre{white-space:pre-wrap;font:12px/1.45 var(--mono);background:var(--panel2);border-radius:8px;padding:10px;margin:8px 0;max-height:320px;overflow:auto}
#printsheet{display:none}
@media print{body>*:not(#printsheet){display:none!important}#printsheet{display:block;color:#000;background:#fff;font:11pt/1.35 Arial,sans-serif;padding:0}#printsheet h1{font-size:18pt;margin:0 0 4pt}#printsheet h2{font-size:12pt;margin:12pt 0 4pt;border-bottom:1px solid #000}#printsheet table{width:100%;border-collapse:collapse}#printsheet td,#printsheet th{border:1px solid #999;padding:4pt;vertical-align:top;text-align:left}#printsheet small{color:#333}body{background:#fff!important}}
.blk{border-left:3px solid var(--tung);padding:4px 0 4px 12px;margin:0 0 16px}
.blk.unset{border-left-color:var(--bad)}
.blk h3{font-size:15px;letter-spacing:.04em}
.blk .it{font-size:14px;margin-top:6px} .blk .it small{color:var(--dim)}
.back{border:0;background:none;color:var(--tung-text);font-size:15px;min-height:var(--tap);padding:0}
.cph{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;display:block;background:var(--panel2);margin-top:4px}
.adrbody{overflow:auto;flex:1;padding:0 14px 14px;color:#eee}
.adrbody video{width:100%;max-height:40vh;background:#000;border-radius:8px}
#adrcount{font:700 40px/1 var(--mono);text-align:center;min-height:44px;margin-top:6px}
.adrtk{border-top:1px solid #333;padding:8px 0}.adrtk.on b{color:var(--tung,#e0a23c)}.adrw{font-size:14px;margin-top:4px}
.adrtk .state{font-size:11px;letter-spacing:.1em;padding:3px 8px;border-radius:99px;background:#e0a23c;color:#111}
.adrtag{color:var(--tung,#e0a23c)}
.mc{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;color:#fff}
/* the camera / mic bar sits at the top while they are on: the overlay header goes under it */
.mc .mchead{padding-top:calc(max(10px,env(safe-area-inset-top)) + 42px)}
#shslate{position:absolute;left:12px;top:12px;font:700 15px/1.2 var(--mono);letter-spacing:.08em;background:rgba(0,0,0,.6);padding:8px 10px;border-radius:8px}#shslate .recd{color:#ff5a4a}
#shrec{min-width:150px}#shrec.rec{background:#d6332a;border-color:#d6332a;color:#fff}
body.mcopen{overflow:hidden}
.mchead{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
.mcview{position:relative;flex:1;min-height:0}
.mcview video,.mcview img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.mcview img{pointer-events:none}
.mc.mirror .mcview video,.mc.mirror .mcview img{transform:scaleX(-1)}
#mccount{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 120px/1 var(--mono);text-shadow:0 0 18px #000;pointer-events:none}
#mcmsg{position:absolute;left:16px;right:16px;top:40%;text-align:center;font-size:16px;background:rgba(0,0,0,.7);padding:14px;border-radius:10px;display:none}
.mcbar{display:flex;gap:8px;align-items:center;justify-content:center;padding:8px 14px;flex-wrap:wrap}
.mcbar:last-child{padding-bottom:max(12px,env(safe-area-inset-bottom))}
.mcsl{display:flex;align-items:center;gap:8px;flex:1 1 200px;font-size:13px}.mcsl input{flex:1}
.cph.none{display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--faint)}
details summary{cursor:pointer;color:var(--tung-text);min-height:var(--tap);display:flex;align-items:center}
.sun{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.sun div{background:var(--panel2);border-radius:10px;padding:8px}
.sun span{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.sun b{font-size:16px}
.runtime{margin-top:12px}.runtime b{font:700 34px/1 var(--mono);display:block}.runtime span{font-size:14px;color:var(--dim)}
.take{border-top:1px solid var(--line);padding:10px 0;opacity:.75}.take.on{opacity:1}
.take.never{opacity:.5}.take.never b{text-decoration:line-through}.take select.mark{flex:0 1 110px;padding:4px 6px;font-size:13px}
.brief{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}.brief summary{cursor:pointer;font-size:14px;font-weight:600}.brief textarea{width:100%}
.fsum{margin-top:10px;font-size:14px}.fsec{margin-top:10px}.fsec b{font-size:13px;display:block;margin-bottom:4px}.fl{font-size:13px;padding:4px 0;border-top:1px solid var(--line);word-break:break-all}.fl.bad{color:#e07a5f}.fl.ok{opacity:.8}
.player{position:fixed;inset:0;z-index:70;background:#000;display:flex;flex-direction:column}
.player .pview{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px}
.player canvas{max-width:100%;max-height:100%;background:#000}
.player .pnote{position:absolute;left:12px;right:12px;bottom:calc(64px + env(safe-area-inset-bottom));background:#1a1a1a;border:1px solid #444;border-radius:12px;padding:12px;color:#eee;display:flex;flex-direction:column;gap:8px}
.player .pnote.hide{display:none}
.player .pnwhere{font-size:13px;color:#bbb}
.wnote{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;font-size:13px;margin-top:6px;padding:6px 8px;border-left:3px solid var(--tung);background:var(--tung-soft)}
.wnote span{min-width:0;word-break:break-word}
.player .bar{display:flex;align-items:center;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:#111;color:#eee}
.player .bar span{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.fhit{display:block;width:100%;text-align:left;border:1px solid var(--line);background:transparent;color:inherit;border-radius:10px;padding:8px 10px;margin-top:6px;cursor:pointer}
.fhit b{display:block;font-size:14px;word-break:break-all}.fhit span{display:block;font-size:13px;color:var(--dim);margin-top:2px}
.take .tnote{margin-top:6px;font-size:13px;min-height:34px;padding:6px 8px}
.take.flash{outline:2px solid #e0a23c;outline-offset:4px;border-radius:6px}
.tprev{width:100%;max-height:220px;background:#000;border-radius:8px;margin-top:6px}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="k">STORY STUDIO</div>
    <b id="title">Make it alone</b>
    <div class="count" id="count"></div>
  </header>
  <main id="main"></main>
</div>
<nav class="tabs" id="tabs">
  <button data-t="script"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/></svg><span>SCRIPT</span></button>
  <button data-t="scenes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M3 8l3-4h4l-3 4M10 8l3-4h4l-3 4"/></svg><span>SCENES</span></button>
  <button data-t="own"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg><span>OWNED</span></button>
  <button data-t="day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>SHOOT DAY</span></button>
  <button data-t="cut"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4L8.1 15.9M14.5 14.5L20 20M8.1 8.1L12 12"/></svg><span>CUT</span></button>
</nav>
<div class="toast" id="toast"></div>
<div id="printsheet"></div>
<input type="file" id="file" accept=".pdf,.txt,.fountain,.fdx,text/plain,application/pdf" class="hide">
<script src="../shared/shelf.js"></script>
<script src="../shared/takes.js"></script>
<script src="../shared/capture.js"></script>
<script src="../shared/kit.js"></script>
<script src="../shared/xlsx.js"></script>
<script src="../actor-os/sides.js"></script>
<script src="../actor-os/pdf.js"></script>
<script src="film.js"></script>
<script src="play.js"></script>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
</body>
</html>
