<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="../shared/tour.js"></script>
<script src="../shared/hot.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SPOTTED · Just passing this along</title>
<meta name="description" content="Something you saw that your reps should know about: paste the notice, the email, the story or the link. It reads what is written, puts your history with the office next to it, and writes the note to your reps.">
<meta name="theme-color" content="#121110">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:Jost;font-weight:400;font-display:swap;src:url(fonts/jost-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Jost;font-weight:500;font-display:swap;src:url(fonts/jost-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:Jost;font-weight:600;font-display:swap;src:url(fonts/jost-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Courier Prime';font-weight:400;font-display:swap;src:url(fonts/courier-prime-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Courier Prime';font-weight:700;font-display:swap;src:url(fonts/courier-prime-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#121110; --panel:#1b1916; --panel2:#24211d; --ink:#ece7dc; --dim:#a39c8e; --faint:#6e675c; --line:#2f2b26;
  --tung:#e0a23c; --tung-ink:#1a1206; --tung-soft:rgba(224,162,60,.14); --tung-text:#e9b25a;
  --bad:#e0785f; --good:#8fbf8a; --blue:#7fa6d6;
  --sans:Jost,system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"Courier Prime","Courier New",Courier,monospace;
  --r:12px; --tap:44px; --nav:64px; color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#ece7dc; --panel:#f6f2ea; --panel2:#e3dccd; --ink:#1d1a15; --dim:#5f584b; --faint:#8a8273; --line:#d3cab8;
  --tung-soft:rgba(224,162,60,.22); --tung-text:#8a5a08; --bad:#a8432c; --good:#3d7a3a; --blue:#2f5f99; color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#ece7dc; --panel:#f6f2ea; --panel2:#e3dccd; --ink:#1d1a15; --dim:#5f584b; --faint:#8a8273; --line:#d3cab8;
  --tung-soft:rgba(224,162,60,.22); --tung-text:#8a5a08; --bad:#a8432c; --good:#3d7a3a; --blue:#2f5f99; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-weight:600;letter-spacing:.02em;margin:0}
.dim{color:var(--dim)} .faint{color:var(--faint)} .hide{display:none!important}
.btn{min-height:var(--tap);padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:500;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--tung);color:var(--tung-ink);border-color:var(--tung)}
.btn.ghost{background:transparent} .btn.block{width:100%} .btn.sm{padding:0 12px;font-size:14px}
.btn.big{min-height:60px;font-size:17px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{min-height:var(--tap);padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--dim)}
.chip.on{background:var(--tung);color:var(--tung-ink);border-color:var(--tung)}
.chip i{font-style:normal;font-size:12px;opacity:.75}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:0 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.msg{padding:12px 14px;border-radius:10px;background:var(--panel2);border-left:3px solid var(--tung);margin:12px 0;font-size:14px}
.msg.bad{border-left-color:var(--bad)}
.field{width:100%;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:10px 12px;font-size:16px;min-height:var(--tap)}
textarea.field{min-height:120px;resize:vertical;font-size:15px}
select.field{appearance:auto}

.shell{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.top{position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .k{font-size:11px;letter-spacing:.22em;color:var(--faint)}
.top b{display:block;font-size:16px;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .count{font-size:13px;color:var(--tung-text);margin-top:1px}
main{flex:1;min-width:0;padding:16px 16px calc(var(--nav) + 24px + env(safe-area-inset-bottom));max-width:720px;width:100%;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{min-height:var(--nav);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;letter-spacing:.12em;color:var(--faint)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--tung-text)}


/* spotted */
.lab{display:block;font-size:13px;color:var(--dim);margin:10px 0 4px}
.small{font-size:13.5px}
.chip.sm{min-height:36px;padding:0 12px}
.lnk{background:none;border:0;color:var(--tung-text);padding:6px 4px;font-size:13.5px}.lnk.faint{color:var(--faint)}
.said{margin:0;padding:0;list-style:none}.said li{padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}.said li:last-child{border-bottom:0}
.said .w{display:inline-block;min-width:78px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.facts{margin:0;padding-left:18px}.facts li{margin:5px 0;font-size:15px}
.must{border-left:3px solid var(--tung);padding:2px 0 2px 10px;margin:6px 0;font-size:15px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.it{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 8px}
.it b{display:block;font-weight:600}.it small{display:block;color:var(--faint)}
.hit{color:var(--tung-text)!important}
.lk{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;padding:9px 0;border-top:1px solid var(--line)}.lk b{font-weight:600}.lk span{display:flex;flex-wrap:wrap;gap:4px 12px}.lk a{color:var(--tung-text);font-size:12px;letter-spacing:.1em;text-decoration:none;font-weight:600}
.pick{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}.pick input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--tung)}.pick b{display:block;font-weight:600}.pick small{display:block;color:var(--faint);font-size:13px}
.off{margin:0 0 14px}.oh{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin:0 0 6px}.oh span{font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.kicker i{font-style:normal;color:var(--faint)}.it .st{float:right;font-size:12px;letter-spacing:.08em;color:var(--tung-text);text-transform:uppercase}
textarea.send{min-height:200px;font:14.5px/1.5 var(--sans)}
.pair{display:flex;gap:6px;margin:6px 0}.pair .field{flex:1 1 0;min-width:0}
.bad{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:var(--panel2);border:1px solid var(--tung);color:var(--ink);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:70;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
body:has(#hotbar) .top{padding-top:calc(env(safe-area-inset-top) + 50px)}
.online{position:fixed;top:0;left:0;right:0;z-index:60;background:var(--tung);color:var(--tung-ink);text-align:center;font-size:12px;letter-spacing:.14em;font-weight:600;padding:7px 10px}
.wi{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin:0 0 8px;color:var(--ink)}
.wi .src{font-size:12px;color:var(--faint);letter-spacing:.04em}.wi b{display:block;margin:3px 0;font-weight:500}.wi .why{font-size:13px;color:var(--tung-text)}.wi .sm2{font-size:13px;color:var(--dim)}.wi .nw{font-size:11px;letter-spacing:.12em;color:var(--tung-text);margin-left:6px}
.wi .row{margin-top:8px}.wi a.btn{color:inherit}.receipt{font-size:13px;color:var(--dim);margin:0;padding-left:18px}
.card.ask{border-color:var(--tung)}.more+.more{border-top:1px solid var(--line);margin-top:8px}#more .facts li.warn{color:var(--tung-text)}.stg .facts li.warn{color:var(--tung-text)}.stg.stale{border-color:var(--tung)}.stl{font-style:normal;color:var(--tung-text)}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="k">SPOTTED</div>
    <b id="title">Just passing this along</b>
    <div class="count" id="count"></div>
  </header>
  <main id="main"></main>
</div>
<nav class="tabs" id="tabs">
  <button data-t="spot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg><span>SPOT</span></button>
  <button data-t="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg><span>LIST</span></button>
  <button data-t="offices"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M8 7h2M14 7h2M8 11h2M14 11h2M8 15h2M14 15h2M10 21v-3h4v3"/></svg><span>OFFICES</span></button>
  <button data-t="juice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3L5 13h6l-1 8 8-10h-6l1-8z"/></svg><span>JUICE</span></button>
  <button data-t="you"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/></svg><span>YOU</span></button>
</nav>
<div class="online" id="online" role="status" aria-live="polite" hidden>ONLINE · getting THE WIRE</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../shared/notes.js"></script>
<script src="../shared/contacts.js"></script>
